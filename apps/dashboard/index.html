          document.getElementById("char-arcana-max").value = 0;
          document.getElementById("char-leader").checked = false;
          document.getElementById("char-blessed").checked = false;
          document.getElementById("char-incamp").checked =
            typeof forceCamp === "boolean" ? forceCamp : state.mode === "camp";
        }
    }

    function saveCharacter(e) {
        e.preventDefault();
        const id = document.getElementById("char-id").value;
        const leader = document.getElementById("char-leader").checked;
        const inCamp = document.getElementById("char-incamp").checked;
        const desiredNumber = parseInt(document.getElementById("char-num").value) || 0;
        
        // Unset other leaders if this one is leader
        if (leader) {
          state.muster.forEach((c) => (c.leader = false));
          state.camp.forEach((c) => (c.leader = false));
        }

        const charData = {
            id: id || uuid(),
          number: desiredNumber,
          name: document.getElementById("char-name").value,
          player: document.getElementById("char-player").value,
          description: document.getElementById("char-desc").value,
          notes: document.getElementById("char-notes").value,
            leader: leader,
          blessed: document.getElementById("char-blessed").checked,
            baggage: false,
          hearts: {
            max: parseInt(document.getElementById("char-hearts-max").value),
            current: parseInt(document.getElementById("char-hearts-current").value),
          }, // temp
          iron: {
            max: parseInt(document.getElementById("char-iron-max").value),
            current: parseInt(document.getElementById("char-iron-current").value),
          },
          arcana: {
            max: parseInt(document.getElementById("char-arcana-max").value),
            current: parseInt(document.getElementById("char-arcana-current").value),
          },
        };

        // Clamp current to [0..max], and treat NaN as sensible defaults
        charData.hearts.max = Math.max(1, charData.hearts.max || 1);
        charData.iron.max = Math.max(0, charData.iron.max || 0);
        charData.arcana.max = Math.max(0, charData.arcana.max || 0);
        charData.hearts.current = Math.max(0, Math.min(charData.hearts.max, charData.hearts.current || 0));
        charData.iron.current = Math.max(0, Math.min(charData.iron.max, charData.iron.current || 0));
        charData.arcana.current = Math.max(0, Math.min(charData.arcana.max, charData.arcana.current || 0));

        // Remove from old list if editing
        if (id) {
          const f = findChar(id);
          if (f) state[f.list] = state[f.list].filter((x) => x.id !== id);
        } else {
          // If new and current wasn't explicitly set, default to max
          if (!document.getElementById("char-hearts-current").value)
            charData.hearts.current = charData.hearts.max;
          if (!document.getElementById("char-iron-current").value)
            charData.iron.current = charData.iron.max;
          if (!document.getElementById("char-arcana-current").value)
            charData.arcana.current = charData.arcana.max;
        }

        // Add to new list
        if (inCamp) state.camp.push(charData);
        else state.muster.push(charData);

        // Enforce sequential unique party order numbers 1..n
        if (desiredNumber > 0) setPartyOrder(charData.id, desiredNumber);
        else normalizePartyOrder();

        saveState();
        closeModal("character-modal");
        renderCharacterLists();
    }

    function closeModal(id) {
        document.getElementById(id).classList.remove("active");
    }

    // --- Others (NPCs/Threats) ---
    function renderOTHERS() {
        const list = document.getElementById("others-list");
        if (!list) return;
        
        list.innerHTML = state.others
          .map((t) => {
            // Map 'fresh' to 'fighting' visually if state hasn't migrated
            const displayStatus = t.status === "fresh" ? "fighting" : t.status;

            const statusIcons = {
              fighting: "⚔️",
              talking: "💬",
              hit: "🩸",
              fled: "💨",
              dead: "💀",
            };
            const currentIcon = statusIcons[displayStatus] || "⚔️";
            
            return `
            <div class="threat-card ${displayStatus}" data-other-id="${t.id}" style="border-left: 4px solid var(--accent);">
              <div class="other-drag-handle" draggable="true" data-other-id="${t.id}" title="Drag to reorder">≡</div>
              <div class="threat-body">
              <div class="threat-header">
                 <div style="flex:1; min-width:0;">
                   <div
                     class="threat-name"
                     style="cursor: pointer"
                     onclick="openOtherModal('${t.id}'); closeAllKebabMenus(); event.stopPropagation();"
                     title="Edit"
                     draggable="false"
                   >${
                     t.name
                   } <span style="font-size:0.8em; margin-left:0.5rem;">${currentIcon}</span></div>
                   <div class="threat-meta">
                      ${t.level ? `<span>Lvl ${t.level}</span>` : ""}
                      ${t.oracle ? `<span>Oracle ${t.oracle}+</span>` : ""}
                      ${
                        t.reaction
                          ? `<span style="color:var(--ink); font-style:italic;">"${t.reaction}"</span>`
                          : ""
                      }
                   </div>
                   ${
                     t.description
                       ? `<div class="char-description">${t.description}</div>`
                       : ""
                   }
                 </div>
                 <div class="kebab" onclick="event.stopPropagation()">
                   <button
                     class="kebab-btn"
                     onclick="toggleOtherMenu('${t.id}', event)"
                     title="Actions"
                     aria-label="Other actions"
                     draggable="false"
                   >
                     ⋮
                   </button>
                   <div class="kebab-menu" id="other-menu-${t.id}">
                     <button class="kebab-item" onclick="updateOtherStatus('${t.id}', 'fighting'); closeAllOtherMenus(); event.stopPropagation();">⚔️ Fighting</button>
                     <button class="kebab-item" onclick="updateOtherStatus('${t.id}', 'talking'); closeAllOtherMenus(); event.stopPropagation();">💬 Talking</button>
                     <button class="kebab-item" onclick="updateOtherStatus('${t.id}', 'hit'); closeAllOtherMenus(); event.stopPropagation();">🩸 Hit</button>
                     <button class="kebab-item" onclick="updateOtherStatus('${t.id}', 'fled'); closeAllOtherMenus(); event.stopPropagation();">💨 Fled</button>
                     <button class="kebab-item" onclick="updateOtherStatus('${t.id}', 'dead'); closeAllOtherMenus(); event.stopPropagation();">💀 Dead</button>
                     <div style="height:1px; background: rgba(0,0,0,0.12); margin: 0.25rem 0;"></div>
                     <button class="kebab-item" onclick="openOtherModal('${t.id}'); closeAllOtherMenus(); event.stopPropagation();">✎ Edit</button>
                     <button class="kebab-item" onclick="deleteOther('${t.id}'); closeAllOtherMenus(); event.stopPropagation();" style="color: var(--heart-red);">🗑 Delete</button>
                   </div>
                 </div>
              </div>
              </div>
            </div>
            `;
          })
          .join("");
          
        initOthersDnD();
    }

    // --- Others Reorder (Drag & Drop) ---
    let draggedOtherId = null;
    let draggedOtherCardEl = null;

    function initOthersDnD() {
      const container = document.getElementById("others-list");
      if (!container) return;

      container.ondragover = (e) => handleOtherDragOver(e, container);
      container.ondrop = (e) => handleOtherDrop(e, container);

      container.querySelectorAll(".other-drag-handle[draggable='true']").forEach((handle) => {
        handle.ondragstart = (e) => {
          draggedOtherId = handle.dataset.otherId;
          draggedOtherCardEl = handle.closest(".threat-card");
          if (draggedOtherCardEl) draggedOtherCardEl.classList.add("dragging");
          try {
            e.dataTransfer.effectAllowed = "move";
            e.dataTransfer.setData("text/plain", draggedOtherId);
          } catch {}
        };
        handle.ondragend = () => {
          if (draggedOtherCardEl) draggedOtherCardEl.classList.remove("dragging");
          draggedOtherId = null;
          draggedOtherCardEl = null;
          applyOthersOrderFromDom(container);
        };
      });
    }

    function handleOtherDragOver(e, container) {
      e.preventDefault();
      const dragging = container.querySelector(".threat-card.dragging");
      if (!dragging) return;
      const after = getDragAfterElement(container, e.clientY, ".threat-card:not(.dragging)");
      if (after == null) container.appendChild(dragging);
      else container.insertBefore(dragging, after);
    }

    function handleOtherDrop(e, container) {
      e.preventDefault();
      applyOthersOrderFromDom(container);
    }

    function applyOthersOrderFromDom(container) {
      const ids = [...container.querySelectorAll(".threat-card")].map((c) => c.dataset.otherId);
      if (!ids.length) return;
      const byId = new Map(state.others.map((o) => [o.id, o]));
      const ordered = ids.map((id) => byId.get(id)).filter(Boolean);
      if (ordered.length !== state.others.length) {
        // Add any missing (safety)
        state.others.forEach((o) => {
          if (!ids.includes(o.id)) ordered.push(o);
        });
      }
      state.others = ordered;
      saveState();
      renderOTHERS();
    }

    function toggleOtherMenu(id, event) {
      event.stopPropagation();
      const menu = document.getElementById(`other-menu-${id}`);
      if (!menu) return;

      const willOpen = !menu.classList.contains("active");
      closeAllKebabMenus();
      if (willOpen) menu.classList.add("active");
    }

    function closeAllKebabMenus() {
      document
        .querySelectorAll(".kebab-menu.active")
        .forEach((m) => m.classList.remove("active"));
    }
    
    // Back-compat name (used by older inline handlers)
    function closeAllOtherMenus() {
      closeAllKebabMenus();
    }

    function toggleCharMenu(id, event) {
      event.stopPropagation();
      const menu = document.getElementById(`char-menu-${id}`);
      if (!menu) return;
      const willOpen = !menu.classList.contains("active");
      closeAllKebabMenus();
      if (willOpen) menu.classList.add("active");
    }

    function randomizeReaction() {
        const roll =
          Math.floor(Math.random() * 6) + 1 + Math.floor(Math.random() * 6) + 1;
        const result = NPC_REACTIONS[roll] || "Neutral";
        document.getElementById("other-reaction").value = result;
    }

    function openOtherModal(id) {
        document.getElementById("other-modal").classList.add("active");
        document.getElementById("other-id").value = id || "";
        if (id) {
          const t = state.others.find((x) => x.id === id);
          document.getElementById("other-name").value = t.name;
          document.getElementById("other-desc").value = t.description;
          document.getElementById("other-level").value = t.level;
          document.getElementById("other-oracle").value = t.oracle;
          document.getElementById("other-reaction").value = t.reaction;
        } else {
            // New
          document.getElementById("other-name").value = "";
          document.getElementById("other-desc").value = "";
          document.getElementById("other-level").value = "";
          document.getElementById("other-oracle").value = "";
            // Auto-roll reaction
          const roll =
            Math.floor(Math.random() * 6) +
            1 +
            Math.floor(Math.random() * 6) +
            1;
          document.getElementById("other-reaction").value =
            NPC_REACTIONS[roll] || "Neutral";
        }
    }

    function saveOther(e) {
        e.preventDefault();
        const id = document.getElementById("other-id").value;
        const data = {
            id: id || uuid(),
          name: document.getElementById("other-name").value,
          description: document.getElementById("other-desc").value,
          level: document.getElementById("other-level").value,
          oracle: document.getElementById("other-oracle").value,
          reaction: document.getElementById("other-reaction").value,
        };

        if (id) {
          const idx = state.others.findIndex((x) => x.id === id);
          if (idx >= 0) {
                // preserve status
                data.status = state.others[idx].status;
                state.others[idx] = data;
            }
        } else {
          data.status = "fresh";
            state.others.push(data);
        }
        saveState();
        closeModal("other-modal");
        renderOTHERS();
    }

    function updateOtherStatus(id, stat) {
        const t = state.others.find((x) => x.id === id);
        if (t) {
          t.status = stat;
          saveState();
          renderOTHERS();
        }
    }
    
    function deleteOther(id) {
        if (confirm("Delete this entry?")) {
          state.others = state.others.filter((x) => x.id !== id);
          saveState();
          renderOTHERS();
        }
    }

    // Init
    init();
  </script>
</body>
</html>
