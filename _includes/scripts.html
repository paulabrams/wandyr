<script>
  // Insight Slot Machine
  const insightSlot = document.getElementById('insightSlot');
  const insightResult = document.getElementById('insightResult');
  let isSpinning = false;
  const options = ['TRAIT', 'ITEM', 'SKILL', 'NAME', 'ASSIST', 'EFFORT'];

  function rollInsight() {
    if (isSpinning) return;
    isSpinning = true;
    insightResult.textContent = 'Rolling...';

    const reels = [
      document.getElementById('reel1'),
      document.getElementById('reel2'),
      document.getElementById('reel3')
    ];

    const results = [];
    const delays = [0, 200, 400]; // Stagger the reel stops

    reels.forEach((reel, index) => {
      const result = Math.floor(Math.random() * 6);
      results.push(result);
      
      // Calculate the position to move to (middle item + offset)
      const position = -(result * 80 + 80); // 80px per item, offset by one item
      
      setTimeout(() => {
        reel.style.transition = 'top 2s cubic-bezier(0.17, 0.67, 0.83, 0.67)';
        reel.style.top = `${position}px`;
      }, delays[index]);
    });

    // Show final result after all reels stop
    setTimeout(() => {
      const finalResult = results[Math.floor(Math.random() * 3)]; // Pick one of the three results
      insightResult.textContent = `Insight Result: ${finalResult + 1} - ${options[finalResult]}`;
      isSpinning = false;
    }, 2600);
  }

  // Oracle Dice
  function rollDice() {
    return Math.floor(Math.random() * 6) + 1;
  }

  function rollOracle() {
    const oracleResult = document.getElementById('oracleResult');
    const dice1 = document.getElementById('dice1');
    const dice2 = document.getElementById('dice2');
    
    oracleResult.textContent = 'Rolling...';
    
    // Animate dice
    dice1.style.transition = 'transform 1s cubic-bezier(0.17, 0.67, 0.83, 0.67)';
    dice2.style.transition = 'transform 1s cubic-bezier(0.17, 0.67, 0.83, 0.67)';
    
    const roll1 = rollDice();
    const roll2 = rollDice();
    const total = roll1 + roll2;
    
    // Set final positions
    dice1.style.transform = `rotateX(${roll1 * 60}deg) rotateY(${roll1 * 60}deg)`;
    dice2.style.transform = `rotateX(${roll2 * 60}deg) rotateY(${roll2 * 60}deg)`;
    
    // Determine result
    let answer = total >= 8 ? "Yes" : "No";
    let flavor = "";
    
    if (roll1 === 6 || roll2 === 6) {
      flavor = " (Sweet!)";
    } else if (roll1 === 1 || roll2 === 1) {
      flavor = " (Spicy!)";
    }
    
    setTimeout(() => {
      oracleResult.textContent = `Oracle Result: ${answer}${flavor} (${roll1} + ${roll2} = ${total})`;
    }, 1000);
  }
</script>
