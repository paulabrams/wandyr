  a {

    font-weight: 500;
    display: inline-block;
    padding: 0.2rem 0;
  }

  a:hover {
    color: #a93226;

  /* Interactive Tools Styles */
  .tools-section {
    background-color: rgba(255, 255, 255, 0.95);
    border-radius: 0.5rem;
    padding: 2rem;
    margin-bottom: 2rem;
  }

  .dice-tray {
    background-color: #2c3e50;
    border-radius: 1rem;
    padding: 2rem;
    margin: 2rem 0;
    min-height: 200px;
    position: relative;
    box-shadow: inset 0 0 20px rgba(0, 0, 0, 0.3);
    perspective: 1000px;
  }

  .dice {
    width: 60px;
    height: 60px;
    position: relative;
    transform-style: preserve-3d;
    transition: transform 1s cubic-bezier(0.17, 0.67, 0.83, 0.67);
    cursor: pointer;
    margin: 1rem;
    display: inline-block;
  }

  .dice-face {
    position: absolute;
    width: 100%;
    height: 100%;
    background: white;
    border: 2px solid #333;
    border-radius: 10px;
    display: flex;
    justify-content: center;
    align-items: center;
    font-size: 2rem;
    font-weight: bold;
    backface-visibility: hidden;
    box-shadow: inset 0 0 10px rgba(0, 0, 0, 0.1);
  }

  /* Front face */
  .dice-face:nth-child(1) {
    transform: translateZ(30px);
  }
  /* Back face */
  .dice-face:nth-child(2) {
    transform: rotateY(180deg) translateZ(30px);
  }
  /* Right face */
  .dice-face:nth-child(3) {
    transform: rotateY(90deg) translateZ(30px);
  }
  /* Left face */
  .dice-face:nth-child(4) {
    transform: rotateY(-90deg) translateZ(30px);
  }
  /* Top face */
  .dice-face:nth-child(5) {
    transform: rotateX(90deg) translateZ(30px);
  }
  /* Bottom face */
  .dice-face:nth-child(6) {
    transform: rotateX(-90deg) translateZ(30px);
  }

  .dice-face::before {
    content: "";
    position: absolute;
    width: 100%;
    height: 100%;
    background: linear-gradient(
      45deg,
      rgba(255, 255, 255, 0.3),
      rgba(255, 255, 255, 0)
    );
    border-radius: 8px;
  }

  .dice-face::after {
    content: "";
    position: absolute;
    width: 100%;
    height: 100%;
    background: linear-gradient(-45deg, rgba(0, 0, 0, 0.1), rgba(0, 0, 0, 0));
    border-radius: 8px;
  }

  .insight-spinner {
    width: 200px;
    height: 200px;
    margin: 2rem auto;
    position: relative;
  }

  .spinner-container {
    width: 100%;
    height: 100%;
    position: relative;
    border-radius: 50%;
    overflow: hidden;
    box-shadow: 0 0 10px rgba(0, 0, 0, 0.2);
  }

  .spinner-segment {
    position: absolute;
    width: 50%;
    height: 50%;
    transform-origin: 100% 100%;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: "Aniron", cursive;
    font-size: 1.2rem;
    color: white;
    text-shadow: 1px 1px 2px rgba(0, 0, 0, 0.5);
    font-weight: bold;
  }

  .spinner-segment:nth-child(1) {
    transform: rotate(0deg);
    background: #c0392b;
  }
  .spinner-segment:nth-child(2) {
    transform: rotate(60deg);
    background: #e74c3c;
  }
  .spinner-segment:nth-child(3) {
    transform: rotate(120deg);
    background: #c0392b;
  }
  .spinner-segment:nth-child(4) {
    transform: rotate(180deg);
    background: #e74c3c;
  }
  .spinner-segment:nth-child(5) {
    transform: rotate(240deg);
    background: #c0392b;
  }
  .spinner-segment:nth-child(6) {
    transform: rotate(300deg);
    background: #e74c3c;
  }

  .spinner-segment span {
    position: absolute;
    top: 25%;
    left: 50%;
    transform: translate(-50%, -50%) rotate(-60deg);
    width: 100px;
    text-align: center;
    font-size: 1.2rem;
    white-space: nowrap;
  }

  .spinner-pointer {
    position: absolute;
    top: -20px;
    left: 50%;
    transform: translateX(-50%);
    width: 0;
    height: 0;
    border-left: 15px solid transparent;
    border-right: 15px solid transparent;
    border-top: 30px solid #2c3e50;
    z-index: 2;
  }

  .spinner-center {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    width: 40px;
    height: 40px;
    background: #2c3e50;
    border-radius: 50%;
    border: 4px solid white;
    z-index: 2;
  }

  .result-display {

  /* Slot Machine Styles */
  .slot-machine {
    width: 300px;
    height: 200px;
    margin: 2rem auto;
    background: #2c3e50;
    border-radius: 10px;
    padding: 20px;

    justify-content: space-between;
    position: relative;
  }

  .reel {
    width: 80px;
    height: 160px;
    background: white;
    border-radius: 5px;
    overflow: hidden;
    position: relative;
    box-shadow: inset 0 0 10px rgba(0, 0, 0, 0.2);
  }

  .reel-strip {
    position: absolute;
    width: 100%;
    transition: top 2s cubic-bezier(0.17, 0.67, 0.83, 0.67);
  }

  .reel-item {
    height: 80px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: "Aniron", cursive;
    font-size: 1.2rem;
    color: white;
    text-shadow: 1px 1px 2px rgba(0, 0, 0, 0.5);
    font-weight: bold;
  }

  .reel-item:nth-child(odd) {
    background: #c0392b;
  }
  .reel-item:nth-child(even) {
    background: #e74c3c;
  }

  .slot-machine::before {
    content: "";
    position: absolute;
    top: 0;
    left: 0;
    right: 0;
    bottom: 0;
    background: linear-gradient(
      180deg,
      rgba(44, 62, 80, 0.9) 0%,
      rgba(44, 62, 80, 0) 20%,
      rgba(44, 62, 80, 0) 80%,
      rgba(44, 62, 80, 0.9) 100%
    );
    pointer-events: none;
  }

  .slot-machine::after {
    content: "";
    position: absolute;
    top: 50%;
    left: 0;
    right: 0;
    height: 80px;
    transform: translateY(-50%);
    background: rgba(255, 255, 255, 0.1);
    border-top: 2px solid rgba(255, 255, 255, 0.3);
    border-bottom: 2px solid rgba(255, 255, 255, 0.3);
    pointer-events: none;

    .dice {
      width: 40px;
      height: 40px;
    }

    .insight-spinner {
      width: 150px;
      height: 150px;
    }

    .tables-grid {
      grid-template-columns: 1fr;
    }
  }
</style>
