title: Wåndyr Interactive
description: Interactive tools and resources for the Wåndyr adventure game
baseurl: ""
url: ""

# Build settings
markdown: kramdown
highlighter: rouge
permalink: pretty

# Collections
collections:
  tables:
    output: true
    permalink: /tables/:name/

# Plugins
plugins:
  - jekyll-sitemap
  - jekyll-seo-tag

# Exclude from processing
exclude:
  - .git
  - .DS_Store
  - node_modules
  - vendor
  - Gemfile.lock

# Include in processing
include:
  - _posts
  - _pages
  - _tables 