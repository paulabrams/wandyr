<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Wåndyr Game Manager</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Georgia', serif;
            background: linear-gradient(135deg, #2c3e50, #3a5a7a);
            background-image: url('../images/Dragon Isles Map.png');
            background-repeat: no-repeat;
            background-position: center center;
            background-attachment: fixed;
            background-size: 40%;
            background-blend-mode: soft-light;
            color: #ecf0f1;
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            background: rgba(44, 62, 80, 0.9);
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
            padding: 30px;
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px 20px;
            border-bottom: 2px solid #34495e;
            margin-bottom: 20px;
            background: rgba(52, 73, 94, 0.3);
        }

        .title {
            font-size: 1.8em;
            color: #f39c12;
            margin: 0;
        }

        .subtitle {
            display: none;
        }

        .view-switcher {
            display: flex;
            justify-content: center;
            gap: 10px;
            margin: 20px 0;
        }

        .view-btn {
            padding: 12px 24px;
            border: none;
            border-radius: 8px;
            font-size: 1.1em;
            cursor: pointer;
            transition: all 0.3s ease;
            font-weight: bold;
        }

        .view-btn.active {
            background: #e67e22;
            color: white;
        }

        .view-btn:not(.active) {
            background: #7f8c8d;
            color: #ecf0f1;
        }

        .view-btn:hover:not(.active) {
            background: #95a5a6;
        }

        .view {
            display: none;
        }

        .view.active {
            display: block;
        }

        .game-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 20px;
            margin-top: 20px;
        }

        .card {
            background: rgba(52, 73, 94, 0.8);
            border-radius: 10px;
            padding: 20px;
            border: 2px solid #34495e;
            transition: transform 0.2s ease;
        }

        .card:hover {
            transform: translateY(-2px);
            border-color: #e67e22;
        }

        .card-title {
            font-size: 1.3em;
            color: #f39c12;
            margin-bottom: 15px;
            text-align: center;
            border-bottom: 1px solid #34495e;
            padding-bottom: 10px;
        }

        .turn-clock {
            text-align: center;
        }

        .clock-display {
            font-size: 4em;
            color: #e74c3c;
            font-weight: bold;
            text-shadow: 0 0 10px rgba(231, 76, 60, 0.5);
            margin: 20px 0;
        }

        .clock-controls {
            display: flex;
            gap: 10px;
            justify-content: center;
            flex-wrap: wrap;
        }

        .btn {
            padding: 12px 20px;
            border: none;
            border-radius: 8px;
            font-size: 1em;
            cursor: pointer;
            font-weight: bold;
            transition: all 0.3s ease;
            color: white;
        }

        .btn-primary {
            background: #3498db;
        }

        .btn-primary:hover {
            background: #2980b9;
        }

        .btn-success {
            background: #27ae60;
        }

        .btn-success:hover {
            background: #229954;
        }

        .btn-danger {
            background: #e74c3c;
        }

        .btn-danger:hover {
            background: #c0392b;
        }

        .btn-warning {
            background: #f39c12;
        }

        .btn-warning:hover {
            background: #e67e22;
        }

        .dice-roller {
            text-align: center;
        }

        .dice-result {
            font-size: 2.5em;
            color: #2ecc71;
            font-weight: bold;
            margin: 15px 0;
            min-height: 60px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .insight-description {
            background: rgba(46, 204, 113, 0.2);
            border-left: 4px solid #2ecc71;
            padding: 15px;
            margin: 10px 0;
            border-radius: 5px;
            font-style: italic;
        }

        .insight-options {
            display: flex;
            flex-direction: column;
            gap: 5px;
            margin: 15px 0;
        }

        .insight-option {
            padding: 8px 12px;
            border: 2px solid #34495e;
            background: rgba(52, 73, 94, 0.5);
            color: #ecf0f1;
            border-radius: 6px;
            text-align: left;
            font-size: 0.9em;
            transition: all 0.3s ease;
        }

        .insight-option.current {
            border-color: #2ecc71;
            background: rgba(46, 204, 113, 0.3);
            color: #2ecc71;
            font-weight: bold;
        }

        .oracle-buttons {
            display: flex;
            gap: 10px;
            justify-content: center;
            flex-wrap: wrap;
            margin-top: 10px;
        }

        .oracle-section {
            text-align: center;
        }

        .oracle-controls {
            display: flex;
            flex-direction: column;
            gap: 15px;
            margin: 20px 0;
        }

        .target-selector {
            display: flex;
            gap: 10px;
            justify-content: center;
            flex-wrap: wrap;
        }

        .target-btn {
            padding: 8px 16px;
            border: 2px solid #34495e;
            background: transparent;
            color: #ecf0f1;
            border-radius: 6px;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .target-btn.active {
            border-color: #e67e22;
            background: #e67e22;
            color: white;
        }

        .oracle-result {
            font-size: 2em;
            font-weight: bold;
            margin: 20px 0;
            min-height: 80px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        .dice-display {
            font-size: 1.5em;
            color: #bdc3c7;
            margin-bottom: 10px;
        }

        .result-text {
            color: #2ecc71;
        }

        .result-text.no {
            color: #e74c3c;
        }

        .sweet-spicy {
            font-size: 0.8em;
            margin-top: 10px;
            padding: 5px 10px;
            border-radius: 5px;
        }

        .sweet {
            background: rgba(46, 204, 113, 0.3);
            color: #2ecc71;
        }

        .spicy {
            background: rgba(231, 76, 60, 0.3);
            color: #e74c3c;
        }

        .game-status {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 15px;
            margin-bottom: 20px;
        }

        .status-item {
            background: rgba(52, 73, 94, 0.6);
            padding: 15px;
            border-radius: 8px;
            text-align: center;
            border: 1px solid #34495e;
        }

        .status-label {
            font-size: 0.9em;
            color: #bdc3c7;
            margin-bottom: 5px;
        }

        .status-value {
            font-size: 1.3em;
            color: #f39c12;
            font-weight: bold;
        }

        .input-group {
            margin: 10px 0;
        }

        .input-group label {
            display: block;
            margin-bottom: 5px;
            color: #bdc3c7;
        }

        .input-group input, .input-group textarea, .input-group select {
            width: 100%;
            padding: 10px;
            border: 1px solid #34495e;
            border-radius: 5px;
            background: rgba(44, 62, 80, 0.8);
            color: #ecf0f1;
            font-size: 1em;
        }

        .input-group input:focus, .input-group textarea:focus, .input-group select:focus {
            outline: none;
            border-color: #e67e22;
        }

        .oracle-generators {
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .generator-section {
            border: 1px solid #34495e;
            border-radius: 8px;
            padding: 15px;
            background: rgba(44, 62, 80, 0.5);
        }

        .generator-section h4 {
            color: #f39c12;
            margin-bottom: 10px;
            text-align: center;
            font-size: 1.1em;
        }

        .generator-controls {
            display: flex;
            flex-direction: column;
            gap: 10px;
            align-items: center;
        }

        .generator-result {
            min-height: 60px;
            background: rgba(52, 73, 94, 0.8);
            border-radius: 5px;
            padding: 15px;
            margin-top: 10px;
            border-left: 4px solid #2ecc71;
            font-style: italic;
            width: 100%;
            text-align: left;
        }

        .generator-result:empty {
            display: none;
        }

        .generator-result h5 {
            color: #f39c12;
            margin-bottom: 8px;
            font-size: 1em;
        }

        .generator-result .tavern-name {
            font-size: 1.2em;
            color: #e67e22;
            font-weight: bold;
            margin-bottom: 10px;
        }

        .generator-result .tavern-vibe {
            color: #bdc3c7;
            line-height: 1.4;
        }

        .oracle-browser {
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .table-selector {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
        }

        .table-controls {
            text-align: center;
        }

        .dice-controls {
            display: flex;
            flex-direction: column;
            gap: 10px;
            align-items: center;
        }

        .table-description {
            font-style: italic;
            color: #bdc3c7;
            margin-bottom: 10px;
            min-height: 20px;
        }

        #rollButton:disabled {
            background: #7f8c8d !important;
            cursor: not-allowed;
        }

        .oracle-result h5 {
            color: #f39c12;
            margin-bottom: 10px;
        }

        .oracle-result .roll-info {
            color: #95a5a6;
            font-size: 0.9em;
            margin-bottom: 10px;
        }

        @media (max-width: 768px) {
            .table-selector {
                grid-template-columns: 1fr;
            }
            .container {
                padding: 15px;
            }
            
            .title {
                font-size: 2em;
            }
            
            .game-grid {
                grid-template-columns: 1fr;
            }
            
            .clock-display {
                font-size: 3em;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1 class="title">Wåndyr</h1>
            <p class="subtitle">Game Master's Digital Companion</p>
            
            <div class="view-switcher">
                <button class="view-btn active" onclick="switchView('guide')">Guide View</button>
                <button class="view-btn" onclick="switchView('player')">Player View</button>
            </div>
        </div>

        <!-- Guide View -->
        <div id="guide-view" class="view active">
            <div class="game-grid">
                <!-- Turn Clock -->
                <div class="card">
                    <h3 class="card-title">Turn Clock</h3>
                    <div class="turn-clock">
                        <div class="clock-display" id="clockDisplay">1</div>
                        <div class="clock-controls">
                            <button class="btn btn-primary" onclick="advanceClock()">Advance Turn</button>
                        </div>
                    </div>
                    
                    <!-- Insight -->
                    <div style="margin-top: 30px;">
                        <h4 style="color: #f39c12; text-align: center; margin-bottom: 15px;">Insight</h4>
                        <div class="insight-options" id="insightOptions"></div>
                    </div>
                </div>


                <!-- Oracle -->
                <div class="card">
                    <h3 class="card-title">The Oracle</h3>
                    <div class="oracle-section">
                        <div class="oracle-controls">
                            <div class="input-group">
                                <label for="oracleQuestion">Question:</label>
                                <input type="text" id="oracleQuestion" placeholder="Ask a yes/no question...">
                            </div>
                            
                            <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 15px; margin: 15px 0;">
                                <div class="input-group">
                                    <label for="partyLevel">Party Level:</label>
                                    <select id="partyLevel" onchange="updateOracleTarget()">
                                        <option value="0">0 (Starting)</option>
                                        <option value="1">1</option>
                                        <option value="2">2</option>
                                        <option value="3">3</option>
                                        <option value="4">4</option>
                                        <option value="5">5</option>
                                    </select>
                                </div>
                                <div class="input-group">
                                    <label for="threatLevel">Threat Level:</label>
                                    <select id="threatLevel" onchange="updateOracleTarget()">
                                        <option value="0">0</option>
                                        <option value="1">1</option>
                                        <option value="2">2</option>
                                        <option value="3">3</option>
                                        <option value="4">4</option>
                                        <option value="5">5</option>
                                    </select>
                                </div>
                            </div>
                            
                            <div class="target-selector">
                                <span id="dynamicTarget" style="color: #f39c12; font-weight: bold; margin-bottom: 10px; display: block; text-align: center;">Target: 8+</span>
                                <button class="target-btn" data-target="6" onclick="setTarget(6)">Easy (6+)</button>
                                <button class="target-btn active" data-target="8" onclick="setTarget(8)">Normal (8+)</button>
                                <button class="target-btn" data-target="10" onclick="setTarget(10)">Hard (10+)</button>
                                <button class="target-btn" data-target="12" onclick="setTarget(12)">Extreme (12+)</button>
                            </div>
                            
                            <div class="oracle-buttons">
                                <button class="btn btn-primary" onclick="rollOracle()">Ask the Oracle (2d6)</button>
                                <button class="btn btn-warning" onclick="rollOracleAdvantage()">Advantage (3d6)</button>
                                <button class="btn btn-danger" onclick="rollOracleDisadvantage()">Disadvantage (3d6)</button>
                            </div>
                        </div>
                        
                        <div class="oracle-result" id="oracleResult"></div>
                    </div>
                </div>

                <!-- Location & Environment -->
                <div class="card">
                    <h3 class="card-title">Location & Environment</h3>
                    <div class="input-group">
                        <label for="worldRegion">World Region:</label>
                        <select id="worldRegion">
                            <option value="">-- Select Region --</option>
                            <option value="Akkar (Draconia)">Akkar (Draconia) - Largest city, major Southmaren port in the southeast</option>
                            <option value="Alglondor">Alglondor - Holy kingdom with river valleys in the northwest</option>
                            <option value="Dorthonia">Dorthonia - Vast taiga dominating northwest shores, home to Elenthar</option>
                            <option value="The Dragon Sea">The Dragon Sea - Vast inland ocean at the heart of the world</option>
                            <option value="The Drunlands">The Drunlands - Dismal land of twisted forests between Hrivlyggdor and Akkar</option>
                            <option value="Harnendor">Harnendor - Southmaren Empire of the far south, crown jewel Aquila</option>
                            <option value="Hrivlyggdor">Hrivlyggdor - Northlands of midnight sun, vast taiga and arctic tundra</option>
                            <option value="Kitania">Kitania - Thriving kingdom covering fertile midlands</option>
                            <option value="Lyonesse">Lyonesse - Rugged central coast with free cities, home to Ashenrise</option>
                            <option value="Nan-Avathar">Nan-Avathar - Grim volcanic ashlands ruled by Vampire Lords</option>
                            <option value="Rochir Plains">Rochir Plains - Vast arid savanna ruled by nomadic horse lords</option>
                            <option value="Sepulchre">Sepulchre - Legendary valley ringed by Wintercrown Mountains</option>
                        </select>
                    </div>
                    <div class="input-group">
                        <label for="location">Current Location:</label>
                        <input type="text" id="location" placeholder="Specific place/settlement/landmark..." list="locationSuggestions">
                        <datalist id="locationSuggestions">
                            <option value="Elenthar">Elenthar - Major city in Dorthonia</option>
                            <option value="Ashenrise">Ashenrise - Major city in Lyonesse</option>
                            <option value="Aquila">Aquila - Crown jewel of Harnendor</option>
                            <option value="Akkar">Akkar - Largest city, major port in Draconia</option>
                            <option value="Draconia">Draconia - Southeastern region</option>
                            <option value="Wintercrown Mountains">Wintercrown Mountains - Northern mountain range</option>
                            <option value="Baradjin">Baradjin - Eastern region</option>
                            <option value="Borrazun">Borrazun - Southern area</option>
                            <option value="The Trackless Sea">The Trackless Sea - Western ocean</option>
                            <option value="Port Sorrow">Port Sorrow - Coastal settlement</option>
                            <option value="The Deadlands">The Deadlands - Desolate region</option>
                            <option value="The Thornwood">The Thornwood - Dark forest</option>
                            <option value="Greyhold">Greyhold - Mountain fortress</option>
                            <option value="Mistral Bay">Mistral Bay - Coastal region</option>
                            <option value="Shadowmere">Shadowmere - Dark waters</option>
                            <option value="Ironhold">Ironhold - Mountain stronghold</option>
                            <option value="Goldspring">Goldspring - Prosperous town</option>
                            <option value="Ravenshollow">Ravenshollow - Dark settlement</option>
                            <option value="Brighthaven">Brighthaven - Coastal city</option>
                            <option value="Thornwall">Thornwall - Fortified border</option>
                        </datalist>
                    </div>
                    <div class="input-group">
                        <label for="currentClimate">Climate:</label>
                        <select id="currentClimate">
                            <option value="temperate">Temperate</option>
                            <option value="tropical">Tropical</option>
                            <option value="arid">Arid/Desert</option>
                            <option value="cold">Cold/Mountain</option>
                            <option value="coastal">Coastal</option>
                            <option value="swamp">Wetland/Swamp</option>
                        </select>
                    </div>
                    <div class="input-group">
                        <label for="currentSeason">Season:</label>
                        <select id="currentSeason">
                            <option value="spring">Spring</option>
                            <option value="summer">Summer</option>
                            <option value="autumn">Autumn</option>
                            <option value="winter">Winter</option>
                        </select>
                    </div>
                    <div class="input-group">
                        <label for="currentWeather">Current Weather:</label>
                        <input type="text" id="currentWeather" placeholder="Current weather conditions...">
                        <button class="btn btn-warning" onclick="generateWeatherForLocation()" style="margin-top: 10px;">Generate Weather</button>
                        <div class="oracle-result" id="weatherResult" style="margin-top: 10px;"></div>
                    </div>
                </div>

                <!-- Game Status -->
                <div class="card">
                    <h3 class="card-title">Game Status</h3>
                    <div class="input-group">
                        <label for="rumors">Active Rumors:</label>
                        <textarea id="rumors" rows="3" placeholder="Current rumors being followed..."></textarea>
                    </div>
                </div>

                <!-- Oracle Table Browser -->
                <div class="card">
                    <h3 class="card-title">Oracle Table Browser</h3>
                    <div class="oracle-browser">
                        <div class="table-selector">
                            <div class="input-group">
                                <label for="tableCategory">Category:</label>
                                <select id="tableCategory" onchange="updateTableList()">
                                    <option value="">-- Select Category --</option>
                                    <option value="taverns">Taverns</option>
                                    <option value="rumors">Rumors</option>
                                    <option value="encounters">Encounters</option>
                                    <option value="loot">Loot & Equipment</option>
                                    <option value="political">Political Intrigue</option>
                                    <option value="quests">Quest Hooks</option>
                                    <option value="worldbuilding">Dragon Isles</option>
                                </select>
                            </div>
                            <div class="input-group">
                                <label for="tableSelect">Table:</label>
                                <select id="tableSelect" onchange="showTableInfo()">
                                    <option value="">-- Select Table --</option>
                                </select>
                            </div>
                        </div>
                        
                        <div class="table-controls">
                            <div class="dice-controls">
                                <span id="tableInfo" class="table-description"></span>
                                <button class="btn btn-primary" onclick="rollOnTable()" id="rollButton" disabled>Roll on Table</button>
                            </div>
                        </div>
                        
                        <div class="oracle-result" id="tableResult"></div>
                    </div>
                </div>

                <!-- Quick Notes -->
                <div class="card">
                    <h3 class="card-title">Session Notes</h3>
                    <div class="input-group">
                        <textarea id="sessionNotes" rows="6" placeholder="Keep track of important events, NPCs, discoveries..."></textarea>
                    </div>
                    <button class="btn btn-success" onclick="saveGameState()">Save Game State</button>
                </div>
            </div>
        </div>

        <!-- Player View -->
        <div id="player-view" class="view">
            <div class="game-status">
                <div class="status-item">
                    <div class="status-label">Turn</div>
                    <div class="status-value" id="playerTurnDisplay">1</div>
                </div>
                <div class="status-item">
                    <div class="status-label">Party Level</div>
                    <div class="status-value" id="playerPartyLevel">0</div>
                </div>
                <div class="status-item">
                    <div class="status-label">Current Insight</div>
                    <div class="status-value" id="playerInsight">Roll for Insight</div>
                </div>
            </div>

            <div class="game-grid">
                <div class="card">
                    <h3 class="card-title">Current Conditions</h3>
                    <div class="input-group">
                        <label>Weather:</label>
                        <div class="status-value" id="playerWeather">Unknown</div>
                    </div>
                    <div class="input-group">
                        <label>Location:</label>
                        <div class="status-value" id="playerLocation">Unknown</div>
                    </div>
                    <div class="input-group">
                        <label>Active Rumors:</label>
                        <div class="status-value" id="playerRumors">None</div>
                    </div>
                </div>

                <div class="card">
                    <h3 class="card-title">Player Oracle</h3>
                    <div class="oracle-section">
                        <div class="oracle-controls">
                            <div class="input-group">
                                <label for="playerQuestion">Your Question:</label>
                                <input type="text" id="playerQuestion" placeholder="Ask a yes/no question...">
                            </div>
                            <button class="btn btn-primary" onclick="rollPlayerOracle()">Ask the Oracle (2d6)</button>
                        </div>
                        <div class="oracle-result" id="playerOracleResult"></div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        // Game State
        let gameState = {
            turn: 1,
            worldRegion: '',
            location: '',
            currentWeather: '',
            partyLevel: 0,
            threatLevel: 0,
            rumors: '',
            sessionNotes: '',
            currentInsight: '',
            oracleTarget: 8,
            currentSeason: 'spring',
            currentClimate: 'temperate'
        };

        // Insight descriptions (corrected from rules)
        const insightDescriptions = {
            1: "TRAIT - Use a helpful Trait. Strong helps open stuck doors or crack heads.",
            2: "ASSET - Use a specific helpful Asset along with the item.",
            3: "ITEM - Use any helpful item.",
            4: "NAME - Use a relevant Name (personal name, byname, title, or named item).",
            5: "ASSIST - Use an Action previously taken that 'sets up' or 'assists' the current roll.",
            6: "EFFORT - Apply more effort. Not possible if carrying Baggage, stealth, climbing, swimming, etc."
        };

        const insightOptions = [
            { id: 1, name: "TRAIT", description: "Use a helpful Trait" },
            { id: 2, name: "ASSET", description: "Use a specific helpful Asset" },
            { id: 3, name: "ITEM", description: "Use any helpful item" },
            { id: 4, name: "NAME", description: "Use a relevant Name" },
            { id: 5, name: "ASSIST", description: "Set up or assist the roll" },
            { id: 6, name: "EFFORT", description: "Apply more effort" }
        ];

        // Comprehensive Oracle Tables organized by category
        const oracleTableData = {
            taverns: {
                "Tavern Names": {

        function rollOracleAdvantage() {
            const dice = [Math.floor(Math.random() * 6) + 1, Math.floor(Math.random() * 6) + 1, Math.floor(Math.random() * 6) + 1];
            
            // Sort dice to find best two, but never remove 1s
            const sortedDice = [...dice].sort((a, b) => b - a);
            let keptDice = [];
            let discardedDice = [];
            
            // Keep all 1s first
            const ones = dice.filter(d => d === 1);
            keptDice = [...ones];
            
            // If we have space for more dice (less than 2 total), add the highest non-1s
            const nonOnes = dice.filter(d => d !== 1).sort((a, b) => b - a);
            while (keptDice.length < 2 && nonOnes.length > 0) {
                keptDice.push(nonOnes.shift());
            }
            
            // Handle case where we have more than 2 dice total due to multiple 1s
            if (keptDice.length > 2) {
                // Keep all 1s, then best of remaining to make exactly 2
                const finalKept = ones.concat(nonOnes.slice(0, 2 - ones.length));
                keptDice = finalKept;
            }
            
            const total = keptDice.reduce((sum, die) => sum + die, 0);
            const target = gameState.oracleTarget;
            const success = total >= target;
            
            let result = `<div class="dice-display">Advantage: [${dice.join(', ')}] → Kept: ${keptDice.join(' + ')} = ${total}</div>`;
            result += `<div class="result-text ${success ? 'yes' : 'no'}">${success ? 'YES' : 'NO'}</div>`;
            
            // Check for Sweet (6) or Spicy (1) in kept dice
            const hasSix = keptDice.includes(6);
            const hasOne = keptDice.includes(1);
            
            if (hasSix && hasOne) {
                result += '<div class="sweet-spicy sweet">Sweet</div><div class="sweet-spicy spicy">Spicy</div>';
            } else if (hasSix) {
                result += '<div class="sweet-spicy sweet">Sweet</div>';
            } else if (hasOne) {
                result += '<div class="sweet-spicy spicy">Spicy</div>';
            }
            
            document.getElementById('oracleResult').innerHTML = result;
        }

            gameState.oracleTarget = target;

        function updateOracleTarget() {
            const partyLevel = parseInt(document.getElementById('partyLevel').value);
            const threatLevel = parseInt(document.getElementById('threatLevel').value);
            
            gameState.partyLevel = partyLevel;
            gameState.threatLevel = threatLevel;
            
            let target;
            const difference = partyLevel - threatLevel;
            if (difference === 0) {
                target = 8; // Equal levels = Normal difficulty
            } else if (difference === 1) {
                target = 7; // Party 1 higher = Easier
            } else if (difference === -1) {
                target = 9; // Threat 1 higher = Harder
            } else if (difference > 1) {
                target = 6; // Party much higher = Very easy
            } else {
                target = 10; // Threat much higher = Very hard
            }
            
            gameState.oracleTarget = target;
            
            // Update target button selection
            document.querySelectorAll('.target-btn').forEach(btn => btn.classList.remove('active'));
            const targetBtn = document.querySelector(`[data-target="${target}"]`);
            if (targetBtn) {
                targetBtn.classList.add('active');
            }
            
            updateDynamicTargetDisplay();
            updatePlayerView();
            localStorage.setItem('wandyrGameState', JSON.stringify(gameState));
        }

        function updateDynamicTargetDisplay() {
            const target = gameState.oracleTarget;
            const partyLevel = gameState.partyLevel || 0;
            const threatLevel = gameState.threatLevel || 0;
            const difference = partyLevel - threatLevel;
            
            let description = `Target: ${target}+`;
            if (difference === 0) {
                description += ' (Balanced)';
            } else if (difference === 1) {
                description += ' (Party +1)';
            } else if (difference === -1) {
                description += ' (Threat +1)';
            } else if (difference > 1) {
                description += ' (Party Advantage)';
            } else {
                description += ' (Threat Advantage)';
            }
            
            const targetElement = document.getElementById('dynamicTarget');
            if (targetElement) {
                targetElement.textContent = description;
            }
        }

            console.log('Generating weather for:', { season, climate });
            
            if (!oracleTables.weatherByClimate[climate] || !oracleTables.weatherByClimate[climate][season]) {
                console.error('No weather data found for climate:', climate, 'season:', season);
                const fallbackWeather = `${season} weather in ${climate} climate`;
                document.getElementById('currentWeather').value = fallbackWeather;
                document.getElementById('weatherResult').innerHTML = `
                    <h5>Generated Weather:</h5>
                    <div>${fallbackWeather}</div>
                `;
                return;
            }
            
            const weatherOptions = oracleTables.weatherByClimate[climate][season];
            const weather = rollFromArray(weatherOptions);
            
            console.log('Generated weather:', weather);
            
            // Update the weather field and show result
            document.getElementById('currentWeather').value = weather;
            document.getElementById('weatherResult').innerHTML = `
                <h5>Generated Weather (${season.charAt(0).toUpperCase() + season.slice(1)} in ${climate.charAt(0).toUpperCase() + climate.slice(1)} climate):</h5>
                <div>${weather}</div>
            `;
            
            // Trigger save
            saveGameState();
        }

        // Dragon Isles Worldbuilding Generators
        function generateRegion() {
            const region = rollFromArray(oracleTables.dragonIslesRegions);
            
            const result = `
                <h5>Dragon Isles Region:</h5>
                <div>${region}</div>
            `;
            
            document.getElementById('worldbuildingResult').innerHTML = result;
        }

        function generateNPC() {
            const culture = Math.random() < 0.5 ? 'northmaren' : 'southmaren';
            const name = culture === 'northmaren' 
                ? rollFromArray(oracleTables.northmarenNames) 
                : rollFromArray(oracleTables.southmarenNames);
            const theme = rollFromArray(oracleTables.npcThemes);
            const deity = rollFromArray(oracleTables.dragonIslesDeities);
            
            const result = `
                <h5>Dragon Isles NPC:</h5>
                <div><strong>${name}</strong> (${culture.charAt(0).toUpperCase() + culture.slice(1)})</div>
                <div><em>Role:</em> ${theme}</div>
                <div><em>Patron Deity:</em> ${deity.split(' - ')[0]}</div>
            `;
            
            document.getElementById('worldbuildingResult').innerHTML = result;
        }

        function generateDeity() {
            const deity = rollFromArray(oracleTables.dragonIslesDeities);
            const [name, description] = deity.split(' - ');
            
            const result = `
                <h5>Dragon Isles Deity:</h5>
                <div><strong>${name}</strong></div>
                <div><em>${description}</em></div>
            `;
            
            document.getElementById('worldbuildingResult').innerHTML = result;
        }

        // Oracle Table Browser Functions
        function updateTableList() {
            console.log('updateTableList() called');
            
            const categoryElement = document.getElementById('tableCategory');
            const tableSelect = document.getElementById('tableSelect');
            const rollButton = document.getElementById('rollButton');
            const tableInfo = document.getElementById('tableInfo');
            
            if (!categoryElement || !tableSelect || !rollButton || !tableInfo) {
                console.error('Missing elements:', {
                    categoryElement: !!categoryElement,
                    tableSelect: !!tableSelect,
                    rollButton: !!rollButton,
                    tableInfo: !!tableInfo
                });
                return;
            }
            
            const category = categoryElement.value;
            console.log('Selected category:', category);
            
            // Clear table list
            tableSelect.innerHTML = '<option value="">-- Select Table --</option>';
            rollButton.disabled = true;
            tableInfo.textContent = '';
            
            console.log('oracleTableData exists:', !!oracleTableData);
            if (oracleTableData) {
                console.log('Available categories:', Object.keys(oracleTableData));
            }
            
            if (category && oracleTableData && oracleTableData[category]) {
                console.log('Found category data, tables available:', Object.keys(oracleTableData[category]));
                
                Object.keys(oracleTableData[category]).forEach(tableName => {
                    const option = document.createElement('option');
                    option.value = tableName;
                    option.textContent = tableName;
                    tableSelect.appendChild(option);
                    console.log('Added table option:', tableName);
                });
                
                console.log('Finished adding', Object.keys(oracleTableData[category]).length, 'tables to dropdown');
            } else {
                console.log('No data found for category:', category, 'or oracleTableData not available');
            }
        }

        function showTableInfo() {
            const category = document.getElementById('tableCategory').value;
            const tableName = document.getElementById('tableSelect').value;
            const rollButton = document.getElementById('rollButton');
            const tableInfo = document.getElementById('tableInfo');
            
            if (category && tableName && oracleTableData[category] && oracleTableData[category][tableName]) {
                const table = oracleTableData[category][tableName];
                tableInfo.textContent = `${table.description} (${table.dice})`;
                rollButton.disabled = false;
            } else {
                tableInfo.textContent = '';
                rollButton.disabled = true;
            }
        }

        function rollOnTable() {
            const category = document.getElementById('tableCategory').value;
            const tableName = document.getElementById('tableSelect').value;
            
            if (!category || !tableName || !oracleTableData[category] || !oracleTableData[category][tableName]) {
                return;
            }
            
            const table = oracleTableData[category][tableName];
            const result = rollFromArray(table.table);
            const roll = Math.floor(Math.random() * table.table.length) + 1;
            
            const resultHtml = `
                <h5>${tableName}</h5>
                <div class="roll-info">Rolled ${roll} on ${table.dice}</div>
                <div>${result}</div>
            `;
            
            document.getElementById('tableResult').innerHTML = resultHtml;
        }

        // Auto-save when inputs change
        document.addEventListener('input', function(e) {
            if (e.target.matches('#worldRegion, #location, #currentWeather, #partyLevel, #threatLevel, #rumors, #sessionNotes, #currentSeason, #currentClimate')) {
                setTimeout(saveGameState, 500); // Debounce saves
            }
        });
    </script>
</body>
</html>
