<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Wåndyr Game Manager</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Georgia', serif;
            background: linear-gradient(135deg, #2c3e50, #3a5a7a);
            color: #ecf0f1;
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            background: rgba(44, 62, 80, 0.9);
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
            padding: 30px;
        }

        .header {
            text-align: center;
            margin-bottom: 30px;
            border-bottom: 2px solid #34495e;
            padding-bottom: 20px;
        }

        .title {
            font-size: 2.5em;
            color: #f39c12;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.5);
            margin-bottom: 10px;
        }

        .subtitle {
            font-size: 1.2em;
            color: #bdc3c7;
            font-style: italic;
        }

        .view-switcher {
            display: flex;
            justify-content: center;
            gap: 10px;
            margin: 20px 0;
        }

        .view-btn {
            padding: 12px 24px;
            border: none;
            border-radius: 8px;
            font-size: 1.1em;
            cursor: pointer;
            transition: all 0.3s ease;
            font-weight: bold;
        }

        .view-btn.active {
            background: #e67e22;
            color: white;
        }

        .view-btn:not(.active) {
            background: #7f8c8d;
            color: #ecf0f1;
        }

        .view-btn:hover:not(.active) {
            background: #95a5a6;
        }

        .view {
            display: none;
        }

        .view.active {
            display: block;
        }

        .game-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 20px;
            margin-top: 20px;
        }

        .card {
            background: rgba(52, 73, 94, 0.8);
            border-radius: 10px;
            padding: 20px;
            border: 2px solid #34495e;
            transition: transform 0.2s ease;
        }

        .card:hover {
            transform: translateY(-2px);
            border-color: #e67e22;
        }

        .card-title {
            font-size: 1.3em;
            color: #f39c12;
            margin-bottom: 15px;
            text-align: center;
            border-bottom: 1px solid #34495e;
            padding-bottom: 10px;
        }

        .turn-clock {
            text-align: center;
        }

        .clock-display {
            font-size: 4em;
            color: #e74c3c;
            font-weight: bold;
            text-shadow: 0 0 10px rgba(231, 76, 60, 0.5);
            margin: 20px 0;
        }

        .clock-controls {
            display: flex;
            gap: 10px;
            justify-content: center;
            flex-wrap: wrap;
        }

        .btn {
            padding: 12px 20px;
            border: none;
            border-radius: 8px;
            font-size: 1em;
            cursor: pointer;
            font-weight: bold;
            transition: all 0.3s ease;
            color: white;
        }

        .btn-primary {
            background: #3498db;
        }

        .btn-primary:hover {
            background: #2980b9;
        }

        .btn-success {
            background: #27ae60;
        }

        .btn-success:hover {
            background: #229954;
        }

        .btn-danger {
            background: #e74c3c;
        }

        .btn-danger:hover {
            background: #c0392b;
        }

        .btn-warning {
            background: #f39c12;
        }

        .btn-warning:hover {
            background: #e67e22;
        }

        .dice-roller {
            text-align: center;
        }

        .dice-result {
            font-size: 2.5em;
            color: #2ecc71;
            font-weight: bold;
            margin: 15px 0;
            min-height: 60px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .insight-description {
            background: rgba(46, 204, 113, 0.2);
            border-left: 4px solid #2ecc71;
            padding: 15px;
            margin: 10px 0;
            border-radius: 5px;
            font-style: italic;
        }

        .oracle-section {
            text-align: center;
        }

        .oracle-controls {
            display: flex;
            flex-direction: column;
            gap: 15px;
            margin: 20px 0;
        }

        .target-selector {
            display: flex;
            gap: 10px;
            justify-content: center;
            flex-wrap: wrap;
        }

        .target-btn {
            padding: 8px 16px;
            border: 2px solid #34495e;
            background: transparent;
            color: #ecf0f1;
            border-radius: 6px;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .target-btn.active {
            border-color: #e67e22;
            background: #e67e22;
            color: white;
        }

        .oracle-result {
            font-size: 2em;
            font-weight: bold;
            margin: 20px 0;
            min-height: 80px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        .dice-display {
            font-size: 1.5em;
            color: #bdc3c7;
            margin-bottom: 10px;
        }

        .result-text {
            color: #2ecc71;
        }

        .result-text.no {
            color: #e74c3c;
        }

        .sweet-spicy {
            font-size: 0.8em;
            margin-top: 10px;
            padding: 5px 10px;
            border-radius: 5px;
        }

        .sweet {
            background: rgba(46, 204, 113, 0.3);
            color: #2ecc71;
        }

        .spicy {
            background: rgba(231, 76, 60, 0.3);
            color: #e74c3c;
        }

        .game-status {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 15px;
            margin-bottom: 20px;
        }

        .status-item {
            background: rgba(52, 73, 94, 0.6);
            padding: 15px;
            border-radius: 8px;
            text-align: center;
            border: 1px solid #34495e;
        }

        .status-label {
            font-size: 0.9em;
            color: #bdc3c7;
            margin-bottom: 5px;
        }

        .status-value {
            font-size: 1.3em;
            color: #f39c12;
            font-weight: bold;
        }

        .input-group {
            margin: 10px 0;
        }

        .input-group label {
            display: block;
            margin-bottom: 5px;
            color: #bdc3c7;
        }

        .input-group input, .input-group textarea, .input-group select {
            width: 100%;
            padding: 10px;
            border: 1px solid #34495e;
            border-radius: 5px;
            background: rgba(44, 62, 80, 0.8);
            color: #ecf0f1;
            font-size: 1em;
        }

        .input-group input:focus, .input-group textarea:focus, .input-group select:focus {
            outline: none;
            border-color: #e67e22;
        }

        @media (max-width: 768px) {
            .container {
                padding: 15px;
            }
            
            .title {
                font-size: 2em;
            }
            
            .game-grid {
                grid-template-columns: 1fr;
            }
            
            .clock-display {
                font-size: 3em;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1 class="title">Wåndyr</h1>
            <p class="subtitle">Game Master's Digital Companion</p>
            
            <div class="view-switcher">
                <button class="view-btn active" onclick="switchView('guide')">Guide View</button>
                <button class="view-btn" onclick="switchView('player')">Player View</button>
            </div>
        </div>

        <!-- Guide View -->
        <div id="guide-view" class="view active">
            <div class="game-grid">
                <!-- Turn Clock -->
                <div class="card">
                    <h3 class="card-title">Turn Clock</h3>
                    <div class="turn-clock">
                        <div class="clock-display" id="clockDisplay">1</div>
                        <div class="clock-controls">
                            <button class="btn btn-primary" onclick="advanceClock()">Advance Turn</button>
                            <button class="btn btn-warning" onclick="resetClock()">Reset Clock</button>
                        </div>
                    </div>
                </div>

                <!-- Insight Roller -->
                <div class="card">
                    <h3 class="card-title">Insight</h3>
                    <div class="dice-roller">
                        <div class="dice-result" id="insightResult">Roll for Insight</div>
                        <button class="btn btn-success" onclick="rollInsight()">Roll d6</button>
                        <div class="insight-description" id="insightDescription" style="display: none;"></div>
                    </div>
                </div>

                <!-- Oracle -->
                <div class="card">
                    <h3 class="card-title">The Oracle</h3>
                    <div class="oracle-section">
                        <div class="oracle-controls">
                            <div class="input-group">
                                <label for="oracleQuestion">Question:</label>
                                <input type="text" id="oracleQuestion" placeholder="Ask a yes/no question...">
                            </div>
                            
                            <div class="target-selector">
                                <button class="target-btn" data-target="6" onclick="setTarget(6)">Easy (6+)</button>
                                <button class="target-btn active" data-target="8" onclick="setTarget(8)">Normal (8+)</button>
                                <button class="target-btn" data-target="10" onclick="setTarget(10)">Hard (10+)</button>
                                <button class="target-btn" data-target="12" onclick="setTarget(12)">Extreme (12+)</button>
                            </div>
                            
                            <button class="btn btn-primary" onclick="rollOracle()">Ask the Oracle (2d6)</button>
                        </div>
                        
                        <div class="oracle-result" id="oracleResult"></div>
                    </div>
                </div>

                <!-- Game Status -->
                <div class="card">
                    <h3 class="card-title">Game Status</h3>
                    <div class="input-group">
                        <label for="weather">Weather/Environment:</label>
                        <input type="text" id="weather" placeholder="Current weather and conditions...">
                    </div>
                    <div class="input-group">
                        <label for="location">Current Location:</label>
                        <input type="text" id="location" placeholder="Where are the adventurers?">
                    </div>
                    <div class="input-group">
                        <label for="partyLevel">Party Level:</label>
                        <select id="partyLevel">
                            <option value="0">0 (Starting)</option>
                            <option value="1">1</option>
                            <option value="2">2</option>
                            <option value="3">3</option>
                            <option value="4">4</option>
                            <option value="5">5</option>
                        </select>
                    </div>
                    <div class="input-group">
                        <label for="rumors">Active Rumors:</label>
                        <textarea id="rumors" rows="3" placeholder="Current rumors being followed..."></textarea>
                    </div>
                </div>

                <!-- Quick Notes -->
                <div class="card">
                    <h3 class="card-title">Session Notes</h3>
                    <div class="input-group">
                        <textarea id="sessionNotes" rows="6" placeholder="Keep track of important events, NPCs, discoveries..."></textarea>
                    </div>
                    <button class="btn btn-success" onclick="saveGameState()">Save Game State</button>
                </div>
            </div>
        </div>

        <!-- Player View -->
        <div id="player-view" class="view">
            <div class="game-status">
                <div class="status-item">
                    <div class="status-label">Turn</div>
                    <div class="status-value" id="playerTurnDisplay">1</div>
                </div>
                <div class="status-item">
                    <div class="status-label">Party Level</div>
                    <div class="status-value" id="playerPartyLevel">0</div>
                </div>
                <div class="status-item">
                    <div class="status-label">Current Insight</div>
                    <div class="status-value" id="playerInsight">Roll for Insight</div>
                </div>
            </div>

            <div class="game-grid">
                <div class="card">
                    <h3 class="card-title">Current Conditions</h3>
                    <div class="input-group">
                        <label>Weather:</label>
                        <div class="status-value" id="playerWeather">Unknown</div>
                    </div>
                    <div class="input-group">
                        <label>Location:</label>
                        <div class="status-value" id="playerLocation">Unknown</div>
                    </div>
                    <div class="input-group">
                        <label>Active Rumors:</label>
                        <div class="status-value" id="playerRumors">None</div>
                    </div>
                </div>

                <div class="card">
                    <h3 class="card-title">Player Oracle</h3>
                    <div class="oracle-section">
                        <div class="oracle-controls">
                            <div class="input-group">
                                <label for="playerQuestion">Your Question:</label>
                                <input type="text" id="playerQuestion" placeholder="Ask a yes/no question...">
                            </div>
                            <button class="btn btn-primary" onclick="rollPlayerOracle()">Ask the Oracle (2d6)</button>
                        </div>
                        <div class="oracle-result" id="playerOracleResult"></div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        // Game State
        let gameState = {
            turn: 1,
            weather: '',
            location: '',
            partyLevel: 0,
            rumors: '',
            sessionNotes: '',
            currentInsight: '',
            oracleTarget: 8
        };

        // Insight descriptions
        const insightDescriptions = {
            1: "TRAIT - Use a helpful Trait. Strong helps open stuck doors or crack heads.",
            2: "ITEM - Use a helpful item. (Special items require a specialized item Skill)",
            3: "SKILL - Use a helpful item Skill; requires the item.",
            4: "NAME - Use a relevant Name (personal name, byname, title, or named item).",
            5: "ASSIST - Use an Action previously taken that 'sets up' or 'assists' the current roll.",
            6: "EFFORT - Apply more effort. Not possible if carrying Baggage, stealth, climbing, swimming, etc."
        };

        // Initialize
        document.addEventListener('DOMContentLoaded', function() {
            loadGameState();
            updatePlayerView();
        });

        function switchView(view) {
            // Update buttons
            document.querySelectorAll('.view-btn').forEach(btn => btn.classList.remove('active'));
            event.target.classList.add('active');
            
            // Update views
            document.querySelectorAll('.view').forEach(v => v.classList.remove('active'));
            document.getElementById(view + '-view').classList.add('active');
            
            if (view === 'player') {
                updatePlayerView();
            }
        }

        function advanceClock() {
            gameState.turn++;
            if (gameState.turn > 6) {
                gameState.turn = 1;
                rollInsight();
            }
            updateClockDisplay();
            updatePlayerView();
            saveGameState();
        }

        function resetClock() {
            gameState.turn = 1;
            updateClockDisplay();
            updatePlayerView();
            saveGameState();
        }

        function updateClockDisplay() {
            document.getElementById('clockDisplay').textContent = gameState.turn;
        }

        function rollInsight() {
            const roll = Math.floor(Math.random() * 6) + 1;
            const description = insightDescriptions[roll];
            
            document.getElementById('insightResult').textContent = roll;
            document.getElementById('insightDescription').textContent = description;
            document.getElementById('insightDescription').style.display = 'block';
            
            gameState.currentInsight = `${roll} - ${description.split(' - ')[0]}`;
            updatePlayerView();
            saveGameState();
        }

        function setTarget(target) {
            gameState.oracleTarget = target;
            document.querySelectorAll('.target-btn').forEach(btn => btn.classList.remove('active'));
            document.querySelector(`[data-target="${target}"]`).classList.add('active');
        }

        function rollOracle() {
            const die1 = Math.floor(Math.random() * 6) + 1;
            const die2 = Math.floor(Math.random() * 6) + 1;
            const total = die1 + die2;
            const target = gameState.oracleTarget;
            const success = total >= target;
            
            let result = `<div class="dice-display">${die1} + ${die2} = ${total}</div>`;
            result += `<div class="result-text ${success ? 'yes' : 'no'}">${success ? 'YES' : 'NO'}</div>`;
            
            // Check for Sweet (6) or Spicy (1)
            const hasSix = die1 === 6 || die2 === 6;
            const hasOne = die1 === 1 || die2 === 1;
            
            if (hasSix && hasOne) {
                result += '<div class="sweet-spicy sweet">Sweet</div><div class="sweet-spicy spicy">Spicy</div>';
            } else if (hasSix) {
                result += '<div class="sweet-spicy sweet">Sweet</div>';
            } else if (hasOne) {
                result += '<div class="sweet-spicy spicy">Spicy</div>';
            }
            
            document.getElementById('oracleResult').innerHTML = result;
        }

        function rollPlayerOracle() {
            const die1 = Math.floor(Math.random() * 6) + 1;
            const die2 = Math.floor(Math.random() * 6) + 1;
            const total = die1 + die2;
            const success = total >= 8; // Default to normal difficulty
            
            let result = `<div class="dice-display">${die1} + ${die2} = ${total}</div>`;
            result += `<div class="result-text ${success ? 'yes' : 'no'}">${success ? 'YES' : 'NO'}</div>`;
            
            // Check for Sweet (6) or Spicy (1)
            const hasSix = die1 === 6 || die2 === 6;
            const hasOne = die1 === 1 || die2 === 1;
            
            if (hasSix && hasOne) {
                result += '<div class="sweet-spicy sweet">Sweet</div><div class="sweet-spicy spicy">Spicy</div>';
            } else if (hasSix) {
                result += '<div class="sweet-spicy sweet">Sweet</div>';
            } else if (hasOne) {
                result += '<div class="sweet-spicy spicy">Spicy</div>';
            }
            
            document.getElementById('playerOracleResult').innerHTML = result;
        }

        function updatePlayerView() {
            document.getElementById('playerTurnDisplay').textContent = gameState.turn;
            document.getElementById('playerPartyLevel').textContent = gameState.partyLevel;
            document.getElementById('playerInsight').textContent = gameState.currentInsight || 'Roll for Insight';
            document.getElementById('playerWeather').textContent = gameState.weather || 'Unknown';
            document.getElementById('playerLocation').textContent = gameState.location || 'Unknown';
            document.getElementById('playerRumors').textContent = gameState.rumors || 'None';
        }

        function saveGameState() {
            // Get values from inputs
            gameState.weather = document.getElementById('weather').value;
            gameState.location = document.getElementById('location').value;
            gameState.partyLevel = parseInt(document.getElementById('partyLevel').value);
            gameState.rumors = document.getElementById('rumors').value;
            gameState.sessionNotes = document.getElementById('sessionNotes').value;
            
            // Save to localStorage
            localStorage.setItem('wandyrGameState', JSON.stringify(gameState));
            
            // Update player view
            updatePlayerView();
            
            // Show feedback
            const btn = event.target;
            const originalText = btn.textContent;
            btn.textContent = 'Saved!';
            btn.style.background = '#27ae60';
            setTimeout(() => {
                btn.textContent = originalText;
                btn.style.background = '';
            }, 2000);
        }

        function loadGameState() {
            const saved = localStorage.getItem('wandyrGameState');
            if (saved) {
                gameState = JSON.parse(saved);
                
                // Update displays
                updateClockDisplay();
                document.getElementById('weather').value = gameState.weather || '';
                document.getElementById('location').value = gameState.location || '';
                document.getElementById('partyLevel').value = gameState.partyLevel || 0;
                document.getElementById('rumors').value = gameState.rumors || '';
                document.getElementById('sessionNotes').value = gameState.sessionNotes || '';
                
                // Set oracle target
                setTarget(gameState.oracleTarget);
                
                // Update insight if available
                if (gameState.currentInsight) {
                    const insightNum = gameState.currentInsight.split(' - ')[0];
                    document.getElementById('insightResult').textContent = insightNum;
                    document.getElementById('insightDescription').textContent = insightDescriptions[insightNum];
                    document.getElementById('insightDescription').style.display = 'block';
                }
            }
        }

        // Auto-save when inputs change
        document.addEventListener('input', function(e) {
            if (e.target.matches('#weather, #location, #partyLevel, #rumors, #sessionNotes')) {
                setTimeout(saveGameState, 500); // Debounce saves
            }
        });
    </script>
</body>
</html>
