<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, user-scalable=no"
    />
  <title>Wåndyr Session Dashboard</title>
    <link
      href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700&family=Crimson+Text:ital,wght@0,400;0,600;1,400&display=swap"
      rel="stylesheet"
    />
  <style>
    :root {
      --parchment: #f4e4bc;
      --parchment-dark: #e8d4a8;
      --parchment-light: #faf3e3;
      --ink: #2c1810;
      --ink-light: #5c4030;
      --accent: #8b4513;
      --accent-dark: #6b3410;
      --heart-red: #a83232;
      --iron-blue: #4a6670;
      --arcana-purple: #6b4a8c;
      --blessing-gold: #d4a017;
      --hit-orange: #c47f17;
      --dead-gray: #666;
      --fled-blue: #4a7090;
      --shadow: rgba(44, 24, 16, 0.2);
      --muster-col-max: 400px;
      --muster-gap: 0.75rem;
      --muster-max-width: calc((var(--muster-col-max) * 3) + (var(--muster-gap) * 2));
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
        font-family: "Crimson Text", Georgia, serif;
        background: url('data:image/svg+xml,<svg xmlns="http://www.w3.org/2000/svg" width="100" height="100" viewBox="0 0 100 100"><rect fill="%23f4e4bc" width="100" height="100"/><circle fill="%23e8d4a8" cx="25" cy="25" r="1" opacity="0.3"/><circle fill="%23e8d4a8" cx="75" cy="75" r="1" opacity="0.3"/><circle fill="%23e8d4a8" cx="50" cy="10" r="0.5" opacity="0.2"/></svg>'),
          linear-gradient(
            135deg,
            var(--parchment) 0%,
            var(--parchment-dark) 50%,
            var(--parchment) 100%
          );
      color: var(--ink);
      min-height: 100vh;
      padding: 0.75rem;
    }

      h1,
      h2,
      h3,
      h4 {
        font-family: "Cinzel", serif;
      font-weight: 600;
    }

    /* Common Components */
    .btn {
        font-family: "Cinzel", serif;
      font-size: 0.8rem;
      font-weight: 600;
      padding: 0.5rem 0.4rem;
      border: 2px solid var(--accent);
      border-radius: 6px;
      background: var(--parchment);
      color: var(--accent-dark);
      cursor: pointer;
      transition: all 0.2s;
      text-transform: uppercase;
      letter-spacing: 0.04em;
      min-height: 36px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
    }

      .btn:hover,
      .btn:active {
      background: var(--accent);
      color: var(--parchment-light);
    }

    .btn.primary {
      background: var(--accent);
      color: var(--parchment-light);
    }

      .btn.primary:hover,
      .btn.primary:active {
      background: var(--accent-dark);
    }
    
    .btn.compact {
      font-size: 0.72rem;
      padding: 0.35rem 0.45rem;
      min-height: 30px;
      letter-spacing: 0.02em;
      white-space: nowrap;
    }
    .btn.compact.primary {
      background: var(--accent);
      color: var(--parchment-light);
    }
    .btn.compact.primary:hover,
    .btn.compact.primary:active {
      background: var(--accent-dark);
    }

    .panel {
        background: linear-gradient(
          to bottom,
          var(--parchment-light),
          var(--parchment)
        );
      border: 2px solid var(--accent);
      border-radius: 8px;
      padding: 0.75rem;
      box-shadow: 0 2px 8px var(--shadow);
      margin-bottom: 0.75rem;
    }

      input,
      select,
      textarea {
        font-family: "Crimson Text", serif;
      font-size: 1rem;
      padding: 0.4rem;
      border: 1px solid var(--accent);
      border-radius: 4px;
      background: var(--parchment-light);
      color: var(--ink);
    }

    /* Header */
    .top-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 0.6rem 0.75rem;
        background: linear-gradient(
          to bottom,
          var(--parchment-light),
          var(--parchment)
        );
      border: 2px solid var(--accent);
      border-radius: 8px;
      max-width: var(--muster-max-width);
      margin: 0 auto 0.75rem;
      box-shadow: 0 2px 8px var(--shadow);
    }

    .top-bar h1 {
      font-size: 1.4rem;
      color: var(--accent-dark);
      letter-spacing: 0.1em;
    }

    .actions-menu {
      position: relative;
    }

    .actions-dropdown {
      display: none;
      position: absolute;
      top: 100%;
      right: 0;
      margin-top: 0.5rem;
      background: var(--parchment);
      border: 2px solid var(--accent);
      border-radius: 6px;
      min-width: 200px;
      box-shadow: 0 4px 12px var(--shadow);
      z-index: 50;
    }

    .actions-dropdown.active {
      display: block;
    }

    .action-item {
      display: block;
      width: 100%;
      padding: 0.75rem 1rem;
      text-align: left;
      background: none;
      border: none;
      border-bottom: 1px solid rgba(139, 69, 19, 0.2);
      color: var(--ink);
        font-family: "Cinzel", serif;
      font-size: 0.9rem;
      cursor: pointer;
    }

    .action-item:last-child {
      border-bottom: none;
    }

    .action-item:hover {
      background: var(--accent);
      color: var(--parchment-light);
    }

    /* Environment Card (Muster) */
    .environment-card {
      /* Keep standard panel style */
      display: block; 
    }
    
    .env-group-wrapper {
      display: flex;
      flex-wrap: wrap;
      gap: 1rem;
      align-items: center;
    }

    .env-field {
      display: flex;
      flex-direction: column;
      gap: 0.2rem;
    }

    .env-field label {
        font-family: "Cinzel", serif;
      font-size: 0.75rem;
      color: var(--ink-light);
      text-transform: uppercase;
    }
    
    .input-with-btn {
      display: flex;
      gap: 0.3rem;
    }
    
    .icon-btn {
      min-width: 32px;
      padding: 0;
      font-size: 1.1rem;
    }

      /* Text Links & Popover */
      .text-link {
        color: var(--ink);
        text-decoration: none;
        cursor: pointer;
        transition: all 0.2s;
      }
      .text-link:hover {
        color: var(--accent);
        text-decoration: underline;
      }

      .popover-menu {
        display: none;
        position: absolute;
        background: var(--parchment);
        border: 2px solid var(--accent);
        border-radius: 6px;
        box-shadow: 0 4px 12px var(--shadow);
        z-index: 100;
        min-width: 200px;
        max-width: 300px;
        max-height: 400px;
        overflow-y: auto;
      }
      .popover-menu.active {
        display: block;
      }
      .popover-header {
        padding: 0.5rem 0.75rem;
        border-bottom: 1px solid rgba(139, 69, 19, 0.2);
        display: flex;
        justify-content: space-between;
        align-items: center;
      }
      .popover-header .btn {
        padding: 0.3rem 0.5rem;
        font-size: 0.75rem;
      }
      .popover-list {
        padding: 0.25rem 0;
      }
      .popover-option {
        padding: 0.5rem 0.75rem;
        cursor: pointer;
        transition: background 0.2s;
      }
      .popover-option:hover {
        background: var(--accent);
        color: var(--parchment-light);
      }
      .popover-option.selected {
        background: var(--parchment-dark);
        font-weight: 600;
      }

    /* Dice Card */
    .dice-card-content {
      display: flex;
      flex-wrap: wrap; /* Fix: Allow wrapping so buttons don't overlap dice */
      align-items: center;
      justify-content: space-between;
      gap: 0.5rem;
    }

    .oracle-dice-display {
      font-size: 1rem;
      color: var(--ink);
      flex: 1 1 auto; /* Allow it to grow/shrink */
      min-width: 120px; /* Ensure some space for dice */
      white-space: nowrap;
      /* background: var(--parchment-dark); REMOVED */
      padding: 0; /* REMOVED padding */
      /* border: 1px solid var(--accent); REMOVED */
    }
    
    .dice-controls {
        display: flex; 
        gap: 0.3rem;
        flex: 0 0 auto; /* Keep buttons from shrinking too much */
    }

    .weather-die {
      font-size: 1.5rem;
      line-height: 1;
      color: var(--ink);
    }

    /* Rumor & Blessing (Camp) */
    .rumor-blessing-card {
      display: flex;
      flex-direction: column;
      gap: 1rem;
    }

      .rumor-row,
      .blessing-row {
      display: flex;
      flex-wrap: wrap;
      gap: 1rem;
      align-items: flex-end;
    }
    
    .rumor-row {
      width: 100%;
    }
    .rumor-row .env-field {
      flex: 1;
    }

    .blessing-row input[type="number"] {
      width: 60px;
    }

    .blessing-toggle-label {
      display: flex;
      align-items: center;
      gap: 0.5rem;
        font-family: "Cinzel", serif;
      color: var(--accent-dark);
      cursor: pointer;
      padding-bottom: 0.5rem;
    }

    /* Views */
      #view-camp,
      #view-muster {
      display: none;
    }

      #view-camp.active,
      #view-muster.active {
      display: grid;
    }

    /* Camp Grid */
    #view-camp.active {
      grid-template-columns: 1fr 1fr;
      gap: 0.75rem;
      align-items: start;
    }

    /* Muster Layout (3 equal columns, flex) */
    #view-muster.active {
      display: flex;
      gap: 0.75rem;
      align-items: flex-start;
      justify-content: center;
      flex-wrap: nowrap;
    }
    
    /* Muster Columns (left / center / right) */
    .muster-col {
      display: flex;
      flex-direction: column;
      gap: 0.75rem;
      min-width: 0;
      flex: 1 1 0;
      max-width: 400px;
    }
    .muster-col .panel {
      margin-bottom: 0;
    }

    /* Responsive Views */
    @media (max-width: 1023px) {
      #view-muster.active {
        flex-wrap: wrap;
      }
      .muster-col {
        max-width: 400px;
        flex: 1 1 340px;
      }
    }

    @media (max-width: 767px) {
        #view-camp.active {
          grid-template-columns: 1fr;
        }
        #view-muster.active {
          flex-direction: column;
          flex-wrap: nowrap;
          align-items: stretch;
        }
      .muster-col {
        max-width: none;
        flex: 1 1 auto;
      }
    }

    /* Time Panel (Compact) */
    .time-panel {
      display: flex;
      flex-direction: column;
      gap: 0.75rem;
    }

      /* Dice display - no outer box, just the inner content */
      .dice-face {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        font-size: 2.5rem;
        color: var(--ink);
        line-height: 1;
        margin: 0 0.12rem;
    }
    .time-counters {
        display: grid;
        grid-template-columns: repeat(2, 1fr);
        gap: 0.4rem;
        text-align: center;
      }
      .counter {
        padding: 0.4rem;
        background: var(--parchment-dark);
        border-radius: 4px;
      }
      .counter-label {
        font-size: 0.65rem;
        color: var(--ink-light);
        text-transform: uppercase;
      }
      .counter-value {
        font-family: "Cinzel", serif;
        font-size: 1.3rem;
        font-weight: 700;
        color: var(--accent-dark);
      }
    
    .insight-display {
        text-align: center;
        padding: 0.75rem;
        background: linear-gradient(
          to bottom,
          var(--accent),
          var(--accent-dark)
        );
        border-radius: 6px;
        color: var(--parchment-light);
        position: relative;
      }
      .insight-label {
        font-size: 0.7rem;
        text-transform: uppercase;
        opacity: 0.8;
      }
      .insight-value {
        font-family: "Cinzel", serif;
        font-size: 1.6rem;
        font-weight: 700;
        margin: 0.2rem 0;
      }
      
      .insight-display.flash {
        animation: insightFlash 420ms ease-out 1;
      }
      @keyframes insightFlash {
        0% {
          box-shadow: 0 0 0 rgba(255, 255, 255, 0);
          filter: brightness(1);
        }
        35% {
          box-shadow: 0 0 0.75rem rgba(250, 243, 227, 0.9);
          filter: brightness(1.15);
        }
        100% {
          box-shadow: 0 0 0 rgba(255, 255, 255, 0);
          filter: brightness(1);
        }
      }
      
      .updated-badge {
        position: absolute;
        right: 0.35rem;
        bottom: 0.3rem;
        font-family: "Cinzel", serif;
        font-size: 0.6rem;
        letter-spacing: 0.04em;
        opacity: 0;
        transition: opacity 300ms ease;
        color: rgba(250, 243, 227, 0.9);
        pointer-events: none;
        user-select: none;
        text-transform: uppercase;
      }
      .updated-badge.show {
        opacity: 1;
      }

      .clock-buttons {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 0.4rem;
      }
 
    /* Adventure Panel */
    .adventure-card {
      display: flex;
      flex-direction: column;
      gap: 0.5rem;
    }
    .adventure-card h2 {
      line-height: 1.05;
    }
    .adventure-card .clock-buttons {
      margin-top: 0.15rem;
    }
    .adventure-card .clock-buttons {
      gap: 0.35rem;
    }
    .adventure-card .btn.compact {
      font-size: 0.68rem;
      padding: 0.32rem 0.38rem;
      min-height: 28px;
    }
    .adventure-result {
      text-align: center;
      font-family: "Cinzel", serif;
      font-weight: 700;
      font-size: 1rem;
      color: var(--accent-dark);
      min-height: 1.4em;
      margin-top: -0.1rem;
    }
    .adventure-result.adventure {
      color: var(--heart-red);
    }
    
    /* Oracle Panel */
    .oracle-card {
      display: flex;
      flex-direction: column;
      gap: 0.5rem;
    }
    .oracle-card .clock-buttons {
      gap: 0.35rem;
    }
    .oracle-result {
      display: flex;
      align-items: center;
      justify-content: center;
      flex-wrap: wrap;
      gap: 0.2rem;
      cursor: pointer;
      min-height: 2.6rem;
      user-select: none;
    }
    .oracle-result:active {
      transform: translateY(1px);
    }

    /* Kebab Menu (Others) */
    .kebab {
      position: relative;
      display: inline-flex;
      align-items: center;
    }
    .kebab-btn {
      font-family: "Cinzel", serif;
      font-weight: 700;
      border: 1px solid var(--ink-light);
      background: var(--parchment);
      border-radius: 6px;
      padding: 0.15rem 0.45rem;
      cursor: pointer;
      line-height: 1.2;
    }
    .kebab-menu {
      position: absolute;
      top: 100%;
      right: 0;
      margin-top: 0.25rem;
      min-width: 190px;
      background: var(--parchment-light);
      border: 1px solid var(--accent);
      border-radius: 8px;
      box-shadow: 0 8px 18px var(--shadow);
      padding: 0.35rem;
      z-index: 20;
      display: none;
    }
    .kebab-menu.active {
      display: block;
    }
    .kebab-item {
      width: 100%;
      text-align: left;
      font-family: "Crimson Text", serif;
      font-size: 0.95rem;
      padding: 0.35rem 0.4rem;
      border: none;
      background: transparent;
      border-radius: 6px;
      cursor: pointer;
      color: var(--ink);
    }
    .kebab-item:hover {
      background: var(--parchment-dark);
    }

    /* Character Cards ... (unchanged) */
    .character-list {
        display: flex;
        flex-direction: column;
        gap: 0.6rem;
      min-height: 100px;
    }
    /* ... */

    .character-card {
      background: var(--parchment-dark);
        border-radius: 6px;
        padding: 0.6rem;
      border-left: 4px solid var(--accent);
      position: relative;
    }
      .character-card.leader {
        border-left-color: gold;
      }
      .character-card.blessed {
        box-shadow: 0 0 8px var(--blessing-gold);
      }
      .character-card.in-camp {
        opacity: 0.8;
        background: #e0cca0;
      }
    
    .character-card {
      cursor: grab;
    }
    .character-card.dragging {
      opacity: 0.55;
      cursor: grabbing;
    }

    .char-header {
        display: flex;
        justify-content: space-between;
        align-items: start;
        gap: 0.5rem;
        margin-bottom: 0.4rem;
    }
    .char-name {
        font-family: "Cinzel", serif;
        font-weight: 600;
        font-size: 1rem;
        display: flex;
        align-items: center;
        gap: 0.4rem;
        flex-wrap: wrap;
    }
    .char-player-inline {
      font-family: "Crimson Text", serif;
      font-weight: 600;
      font-size: 0.95rem;
      color: var(--ink-light);
      opacity: 0.9;
    }
    .char-number {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        width: 22px;
        height: 22px;
        background: var(--accent);
        color: var(--parchment-light);
        border-radius: 50%;
        font-size: 0.8rem;
        font-weight: 700;
      }
      .leader-crown {
        color: gold;
        text-shadow: 0 1px 2px var(--shadow);
      }
      .blessed-star {
        color: var(--blessing-gold);
        text-shadow: 0 0 4px var(--blessing-gold);
      }

      .char-player {
        font-size: 0.8rem;
        color: var(--ink-light);
        margin-bottom: 0.3rem;
        opacity: 0.8;
      }

      .char-description {
        font-size: 0.85rem;
        font-style: italic;
        color: var(--ink-light);
        margin-bottom: 0.4rem;
      }

      .char-stats {
        display: flex;
        align-items: center;
        justify-content: flex-start;
        gap: 0.75rem 1rem;
        flex-wrap: wrap;
      }
      .stat-row {
        display: inline-flex;
        align-items: center;
        gap: 0.35rem;
        min-width: 0;
      }
      .stat-label {
        font-size: 0.75rem;
        color: var(--ink-light);
        width: auto;
        white-space: nowrap;
      }
      .stat-value {
        font-family: "Cinzel", serif;
        font-weight: 700;
        font-size: 1rem;
        min-width: 0;
        white-space: nowrap;
        text-align: left;
        cursor: pointer;
        user-select: none;
      }
      .stat-value:active {
        transform: translateY(1px);
      }
      .stat-value.hearts {
        color: var(--heart-red);
      }
      .stat-value.iron {
        color: var(--iron-blue);
      }
      .stat-value.arcana {
        color: var(--arcana-purple);
      }
    
      /* +/- buttons removed: click value (-), shift-click (+) */

    /* Prefer single-line stats; allow wrap on small screens */
    @media (min-width: 768px) {
      .char-stats {
        flex-wrap: nowrap;
      }
    }

    .char-controls button {
        font-size: 0.7rem;
        padding: 0.2rem 0.4rem;
        border: 1px solid var(--ink-light);
        border-radius: 3px;
        background: var(--parchment);
        cursor: pointer;
      }
      .char-controls button:hover {
        background: var(--ink-light);
        color: var(--parchment);
      }

      .char-extras {
        margin-top: 0.5rem;
        display: flex;
        gap: 0.8rem;
        font-size: 0.8rem;
        color: var(--ink-light);
      }
      .notes-toggle {
        text-decoration: underline;
        cursor: pointer;
        color: var(--accent);
      }
      .char-notes {
        margin-top: 0.4rem;
        padding: 0.4rem;
        background: var(--parchment-light);
        border-radius: 4px;
        font-size: 0.85rem;
        white-space: pre-wrap;
        display: none;
      }
      .char-notes.visible {
        display: block;
      }

    /* Threat Cards */
      .threats-list {
        display: flex;
        flex-direction: column;
        gap: 0.5rem;
      }
    .threat-card {
        background: var(--parchment-dark);
        border-radius: 6px;
        padding: 0.5rem;
      border-left: 4px solid var(--ink-light);
    }
    .threat-card {
      cursor: grab;
    }
    .threat-card.dragging {
      opacity: 0.55;
      cursor: grabbing;
    }
    .threat-card {
      display: flex;
      align-items: stretch;
      gap: 0.5rem;
    }
    .other-drag-handle {
      width: 22px;
      border-radius: 6px;
      background: rgba(0, 0, 0, 0.06);
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: grab;
      user-select: none;
      flex: 0 0 auto;
    }
    .threat-card.dragging .other-drag-handle {
      cursor: grabbing;
    }
    .other-drag-handle:active {
      transform: translateY(1px);
    }
    .threat-body {
      flex: 1 1 auto;
      min-width: 0;
    }
      .threat-card.hit {
        border-left-color: var(--hit-orange);
      }
      .threat-card.dead {
        border-left-color: var(--dead-gray);
        opacity: 0.6;
      }
      .threat-card.fled {
        border-left-color: var(--fled-blue);
        opacity: 0.7;
      }

      .threat-header {
        display: flex;
        justify-content: space-between;
        align-items: start;
        gap: 0.5rem;
      }
      .threat-name {
        font-family: "Cinzel", serif;
        font-weight: 600;
        font-size: 0.95rem;
      }
      .threat-meta {
        font-size: 0.75rem;
        color: var(--ink-light);
        display: flex;
        gap: 0.6rem;
      }

      .threat-controls {
        display: flex;
        gap: 0.3rem;
        align-items: center;
        flex-wrap: wrap;
        margin-top: 0.3rem;
      }
      .threat-controls select {
        font-size: 0.8rem;
        padding: 0.1rem;
        height: 24px;
      }
      .threat-controls button {
        font-size: 0.7rem;
        padding: 0.1rem 0.4rem;
        border: 1px solid var(--ink-light);
        background: var(--parchment);

        border-radius: 3px;
      }

        padding: 0.5rem;

        border-radius: 6px;
        background: transparent;
        color: var(--accent);
        cursor: pointer;
      }
      .add-btn:hover {
        background: var(--accent);
        color: var(--parchment-light);
        border-style: solid;
      }

    .modal-overlay {
        display: none;
        position: fixed;
        top: 0;
        left: 0;
        right: 0;
        bottom: 0;
        background: rgba(0, 0, 0, 0.5);
        justify-content: center;
        align-items: center;
        z-index: 100;
        padding: 1rem;
      }
      .modal-overlay.active {
        display: flex;
      }
    .modal {
        background: var(--parchment);
        border: 3px solid var(--accent);
        border-radius: 8px;
        padding: 1.25rem;
        width: 100%;
        max-width: 450px;
        max-height: 90vh;
        overflow-y: auto;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.3);
    }
      .modal h3 {
        margin-bottom: 0.75rem;
        color: var(--accent-dark);
        text-align: center;
      }
      .modal-form {
        display: flex;
        flex-direction: column;
        gap: 0.8rem;
      }
      .num-3 {
        width: 5.2ch;
        max-width: 5.2ch;
      }
      #char-num {
        width: 6ch;
        max-width: 6ch;
      }
      .form-group {
        display: flex;
        flex-direction: column;
        gap: 0.2rem;
      }
      .form-group label {
        font-size: 0.8rem;
        color: var(--ink-light);
      }
      .form-row {
        display: flex;
        gap: 0.6rem;
      }
      .form-row .form-group {
        flex: 1;
      }
      .checkbox-row {
        display: flex;
        gap: 1rem;
        flex-wrap: wrap;
        margin-top: 0.5rem;
      }
      .checkbox-row label {
        display: flex;
        align-items: center;
        gap: 0.3rem;
        font-size: 0.9rem;
        cursor: pointer;
      }
      .modal-buttons {
        display: flex;
        gap: 0.5rem;
        margin-top: 1rem;
      }
      .modal-buttons button {
        flex: 1;
      }

      #import-file {
        display: none;
      }

<body>
  <!-- Header -->
  <header class="top-bar">
    <h1 id="app-title">Wåndyr</h1>
    <div class="actions-menu">
      <button class="btn" onclick="toggleActions()">☰ Actions</button>
      <div class="actions-dropdown" id="actions-dropdown">
          <button class="action-item" onclick="toggleModeModeSwitch()">
            Switch Mode
          </button>
          <button class="action-item" onclick="exportData()">
            Export Session
          </button>
          <button
            class="action-item"
            onclick="document.getElementById('import-file').click()"
          >
            Import Session
          </button>
          <button class="action-item" onclick="resetSession()">
            Reset Session
          </button>
      </div>
    </div>
      <input
        type="file"
        id="import-file"
        accept=".json"
        onchange="importData(event)"
      />
  </header>

  <!-- CAMP MODE VIEW -->
  <main id="view-camp">
    <!-- Rumor & Blessing -->
      <section class="panel rumor-blessing-card" style="grid-column: 1 / -1">
      <h2>Rumors & Blessings</h2>
      <div class="rumor-row">
        <div class="env-field">
          <label>Current Rumor</label>
            <input
              type="text"
              id="camp-rumor"
              placeholder="What do they say..."
              onchange="updateRumor()"
            />
        </div>
      </div>
      <div class="blessing-row">
          <div class="env-field" style="flex: 2">
          <label>Blessing Source</label>
            <input
              type="text"
              id="camp-bless-source"
              placeholder="e.g. The Forest Spirit"
              onchange="updateBlessing()"
            />
        </div>
        <div class="env-field">
          <label>Value</label>
            <input
              type="number"
              id="camp-bless-value"
              value="0"
              min="0"
              onchange="updateBlessing()"
            />
        </div>
        <div class="blessing-toggle-label">
            <label
              ><input
                type="checkbox"
                id="camp-bless-active"
                onchange="updateBlessing()"
              />
              Blessing Active</label
            >
        </div>
      </div>
    </section>

    <!-- Mustering List -->
    <section class="panel">
      <h2>Mustering</h2>
      <div class="character-list" id="camp-muster-list"></div>
        <button class="add-btn" onclick="openCharacterModal(null, false)">
          + Add Character
        </button>
    </section>

    <!-- Camping List -->
    <section class="panel">
      <h2>Camping</h2>
      <div class="character-list" id="camp-camp-list"></div>
        <button class="add-btn" onclick="openCharacterModal(null, true)">
          + Add Character
        </button>
    </section>
  </main>

  <!-- MUSTER MODE VIEW -->
  <main id="view-muster">
    <div class="muster-col left-col">
      <!-- Environment Card -->
      <section class="panel environment-card">
        <h2>Where are we?</h2>
        <div class="environment-story">
          <p class="env-sentence">
            Location:
            <span
              id="text-region"
              class="text-link"
              onclick="openLocationMenu(event)"
            ></span>
          </p>
          <p class="env-conditions">
            Terrain:
            <span
              id="text-climate"
              class="text-link"
              onclick="openEnvMenu(event, 'climate', TERRAIN_DATA.zones, 'Climate Zone')"
            ></span>
            <span
              id="text-landform"
              class="text-link"
              onclick="openEnvMenu(event, 'landform', TERRAIN_DATA.landforms[state.environment.climate], 'Landform')"
            ></span>
            <span
              id="text-terrain_condition"
              class="text-link"
              style="font-style: italic"
              onclick="openEnvMenu(event, 'terrain_condition', TERRAIN_DATA.terrainConditions, 'Terrain Condition')"
            ></span>
          </p>

          <p class="env-conditions">
            Conditions:
            <span
              id="text-weather_pattern"
              class="text-link"
              onclick="openEnvMenu(event, 'weather_pattern', TERRAIN_DATA.weatherPatterns[state.environment.climate], 'Weather Pattern')"
            ></span>
            <span
              id="text-weather_condition"
              class="text-link"
              onclick="openEnvMenu(event, 'weather_condition', TERRAIN_DATA.weatherConditions, 'Weather Condition')"
            ></span>
          <span
            class="env-seasonal"
            id="text-seasonal-note"
            style="
              font-size: 0.85rem;
              font-style: italic;
              color: var(--ink-light);
              margin-top: 0.25rem;
            "
          ></span>
          </p>
          <p class="env-features">
            Point of Interest:
            <span
              id="text-poi"
              class="text-link"
              onclick="openEnvMenu(event, 'poi', TERRAIN_DATA.pois, 'Point of Interest')"
            ></span>
          </p>
          <p class="env-transition">
            Transition:
            <span
              id="text-transition"
              class="text-link"
              style="font-style: italic"
              onclick="openEnvMenu(event, 'transition', TERRAIN_DATA.transitions, 'Transition')"
            ></span>
            <span
              id="text-transition_to"
              class="text-link"
              style="font-style: italic"
              onclick="openEnvMenu(event, 'transition_to', TERRAIN_DATA.landforms[state.environment.climate], 'Transition To')"
            ></span>
          </p>
        </div>
      </section>

      <!-- Time + Insight (no Turn Clock dice) -->
      <section class="panel time-panel">
        <h2>Time</h2>

        <div
          class="insight-display"
          style="cursor: pointer"
          onclick="rollInsight()"
          title="Click to roll Insight"
        >
          <div class="insight-label">Insight</div>
          <div class="insight-value" id="insight-value">—</div>
          <div class="updated-badge" id="insight-updated-badge">updated</div>
        </div>

        <div class="time-counters">
          <div
            class="counter"
            style="cursor: pointer"
            onclick="resetTurnCount()"
            title="Click to Reset Turn Count"
          >
            <div class="counter-label">Turn</div>
            <div class="counter-value" id="count-turn">0</div>
          </div>
          <div class="counter">
            <div class="counter-label">Round</div>
            <div class="counter-value" id="count-round">0</div>
          </div>
        </div>

        <div class="clock-buttons">
          <button class="btn primary" onclick="advanceTurn()">+ Turn</button>
          <button class="btn primary" onclick="advanceRound()">+ Round</button>
        </div>
      </section>

      <!-- Adventure Roll -->
      <section class="panel adventure-card">
        <h2>Adventure</h2>
        <div class="clock-buttons" style="grid-template-columns: 1fr 1fr 1fr 1fr">
          <button class="btn compact" onclick="rollAdventure('easy')">Easy</button>
          <button class="btn compact primary" onclick="rollAdventure('normal')">Normal (8)</button>
          <button class="btn compact" onclick="rollAdventure('hard')">Hard</button>
          <button class="btn compact" onclick="rollAdventure('extreme')">Extreme</button>
        </div>
        <div id="adventure-result" class="adventure-result"></div>
      </section>

      <!-- Ask the Oracle -->
      <section class="panel oracle-card">
        <h2>Oracle</h2>
        <div class="clock-buttons" style="grid-template-columns: 1fr 1fr 1fr">
          <button class="btn compact primary" onclick="rollOracle('normal'); event.stopPropagation();" title="Roll 2d6">
            Roll
          </button>
          <button class="btn compact" onclick="rollOracle('adv'); event.stopPropagation();" title="Advantage (3d6 drop low)">
            Advantage
          </button>
          <button class="btn compact" onclick="rollOracle('dis'); event.stopPropagation();" title="Disadvantage (3d6 drop high)">
            Disadvantage
          </button>
        </div>
        <div
          id="oracle-result"
          class="oracle-result"
          onclick="rollOracle('normal')"
          title="Click result to roll"
        ></div>
      </section>
    </div>

    <div class="muster-col center-col">
      <!-- Muster List (Active Play) -->
      <section class="panel">
        <h2>Muster</h2>
        <div class="character-list" id="play-muster-list"></div>
      </section>
    </div>

    <div class="muster-col right-col">
      <!-- Others (NPCs/Threats) -->
      <section class="panel">
        <h2>Others</h2>
        <div class="threats-list" id="others-list"></div>
        <button class="add-btn" onclick="openOtherModal()">+ Another</button>
      </section>
    </div>
  </main>

  <!-- Character Modal -->
  <div class="modal-overlay" id="character-modal">
    <div class="modal">
      <h3 id="char-modal-title">Edit Character</h3>
      <form class="modal-form" onsubmit="saveCharacter(event)">
          <input type="hidden" id="char-id" />
        <div class="form-row">
          <div class="form-group" style="flex: 0 0 72px">
            <label>#</label>
            <input type="number" id="char-num" min="1" max="99" />
          </div>
          <div class="form-group" style="flex: 2">
            <label>Name</label>
            <input type="text" id="char-name" required />
          </div>
          <div class="form-group" style="flex: 0 0 96px">
            <label>Player</label>
            <input type="text" id="char-player" />
          </div>
        </div>

        <div class="form-group">
          <label>Description</label>
          <input type="text" id="char-desc" />
        </div>
        <div class="form-group">
          <label>Hearts</label>
          <div style="display:flex; gap:0.35rem; align-items:center;">
            <input type="number" id="char-hearts-current" class="num-3" value="7" min="0" max="100" aria-label="Hearts current" />
            <span style="color: var(--ink-light); font-family: 'Cinzel', serif;">/</span>
            <input type="number" id="char-hearts-max" class="num-3" value="7" min="1" max="100" aria-label="Hearts max" />
          </div>
        </div>

        <div class="form-group">
          <label>Iron Hearts</label>
          <div style="display:flex; gap:0.35rem; align-items:center;">
            <input type="number" id="char-iron-current" class="num-3" value="0" min="0" max="100" aria-label="Iron current" />
            <span style="color: var(--ink-light); font-family: 'Cinzel', serif;">/</span>
            <input type="number" id="char-iron-max" class="num-3" value="0" min="0" max="100" aria-label="Iron max" />
          </div>
        </div>

        <div class="form-group">
          <label>Arcana Hearts</label>
          <div style="display:flex; gap:0.35rem; align-items:center;">
            <input type="number" id="char-arcana-current" class="num-3" value="0" min="0" max="100" aria-label="Arcana current" />
            <span style="color: var(--ink-light); font-family: 'Cinzel', serif;">/</span>
            <input type="number" id="char-arcana-max" class="num-3" value="0" min="0" max="100" aria-label="Arcana max" />
          </div>
        </div>
        <div class="checkbox-row">
            <label><input type="checkbox" id="char-leader" /> Leader</label>
            <label><input type="checkbox" id="char-blessed" /> Blessed</label>
            <label><input type="checkbox" id="char-incamp" /> In Camp</label>
        </div>
        
        <div class="form-group">
          <label>Notes</label>
          <textarea id="char-notes"></textarea>
        </div>
        <div class="modal-buttons">
            <button
              type="button"
              class="btn"
              onclick="closeModal('character-modal')"
            >
              Close
            </button>
            <button type="submit" class="btn primary">Save</button>
        </div>
      </form>
    </div>
  </div>

  <!-- Other/Threat Modal -->
  <div class="modal-overlay" id="other-modal">
      <div class="modal">
        <h3 id="other-modal-title">Other</h3>
        <form class="modal-form" onsubmit="saveOther(event)">
          <input type="hidden" id="other-id" />
          <div class="form-group">
            <label>Name</label>
            <input type="text" id="other-name" required />
          </div>
          <div class="form-group">
            <label>Description</label>
            <textarea id="other-desc"></textarea>
          </div>
          <div class="form-row">
              <div class="form-group">
                 <label>Reaction</label>
              <div style="display: flex; gap: 0.5rem">
                <select id="other-reaction" style="flex: 1">
                        <option value="Hostile">Hostile</option>
                        <option value="Suspicious">Suspicious</option>
                        <option value="Fearful">Fearful</option>
                        <option value="Dismissive">Dismissive</option>
                        <option value="Reluctant">Reluctant</option>
                        <option value="Neutral">Neutral</option>
                        <option value="Interested">Interested</option>
                        <option value="Pleasant">Pleasant</option>
                        <option value="Friendly">Friendly</option>
                        <option value="Enthusiastic">Enthusiastic</option>
                        <option value="Trusting">Trusting</option>
                     </select>
                <button
                  type="button"
                  class="btn icon-btn"
                  onclick="randomizeReaction()"
                  title="Randomize Reaction"
                >
                  ⟳
                </button>
                 </div>
              </div>
          </div>
          <div class="form-row">
            <div class="form-group">
              <label>Level</label>
              <input type="number" id="other-level" min="0" />
            </div>
            <div class="form-group">
              <label>Oracle</label>
              <select id="other-oracle">
                <option value="">—</option>
                <option value="6">Easy (6)</option>
                <option value="8">Normal (8)</option>
                <option value="10">Hard (10)</option>
                <option value="12">Extreme (12)</option>
              </select>
            </div>
          </div>
          <div class="modal-buttons">
            <button
              type="button"
              class="btn"
              onclick="closeModal('other-modal')"
            >
              Close
            </button>
            <button type="submit" class="btn primary">Save</button>
          </div>
        </form>
      </div>
  </div>

      function selectLocationFromElement(el, event) {
        if (event) {

          .replace(/&quot;/g, '"');

        // Add current location to previous if it's not already there
        if (
          state.environment.region &&
          !state.previousLocations.includes(state.environment.region)
        ) {
          state.previousLocations.push(state.environment.region);
          // Keep only last 10
          if (state.previousLocations.length > 10) {
            state.previousLocations = state.previousLocations.slice(-10);
          }
        }
        state.environment.region = name;
        saveState();
        renderEnvironment();
        closePopover();
      }

        closePopover();

        const currentName = state.environment.region || "";
        const newName = prompt("Edit location name:", currentName);
        if (newName !== null && newName.trim() !== "") {
          // Add old name to previous if it exists
          if (currentName && !state.previousLocations.includes(currentName)) {
            state.previousLocations.push(currentName);
            if (state.previousLocations.length > 10) {
              state.previousLocations = state.previousLocations.slice(-10);

          saveState();

    function openEnvMenu(event, stateKey, options, label) {
        event.stopPropagation();
        const target = event.target;
        const rect = target.getBoundingClientRect();
        
        // Close existing
        closePopover();

        // Handle dynamic options (landform, weather_pattern depend on climate)
        if (!options || options.length === 0) {
          if (stateKey === "landform") {
            options = TERRAIN_DATA.landforms[state.environment.climate] || [];
          } else if (stateKey === "weather_pattern") {
            options =
              TERRAIN_DATA.weatherPatterns[state.environment.climate] || [];
          }
        }
        
        // Transition To special case:
        // If Transition is 1-3 (same landform), Transition To must mirror current landform.
        let lockTransitionTo = false;
        if (stateKey === "transition_to" && state.environment.transition) {
          const transitionIndex = TERRAIN_DATA.transitions.indexOf(
            state.environment.transition
          );
          if (transitionIndex >= 0 && transitionIndex < 3) {
            lockTransitionTo = true;
            options = [state.environment.landform].filter(Boolean);
          }
        }

        if (!options || options.length === 0) {
          console.warn(`No options available for ${stateKey}`);
          return;
        }
        
        // Create/Get Popover
        let popover = document.getElementById("env-popover");
        if (!popover) {
          popover = document.createElement("div");
          popover.id = "env-popover";
          popover.className = "popover-menu";
            document.body.appendChild(popover);
        }
        
        // Content
        let html = `
            <div class="popover-header">
                <span style="font-family: 'Cinzel', serif; font-weight: 600; font-size: 0.9rem;">${label}</span>
                ${
                  lockTransitionTo
                    ? `<span style="font-size:0.8rem; color: var(--ink-light); font-style: italic;">(same landform)</span>`
                    : `<button class="btn" onclick="randomizeAndSelect('${stateKey}'); event.stopPropagation();" title="Randomize">⟳</button>`
                }
            </div>
            <div class="popover-list">
        `;
        
        options.forEach((opt) => {
            const isSel = state.environment[stateKey] === opt;
          const escapedOpt = opt.replace(/"/g, "&quot;").replace(/'/g, "&#39;");
          html += `<div class="popover-option ${
            isSel ? "selected" : ""
          }" data-key="${stateKey}" data-value="${escapedOpt}" onclick="selectEnvOptionFromElement(this)">${opt}</div>`;
        });
        html += `</div>`;
        
        popover.innerHTML = html;
        popover.classList.add("active");
        
        // Position
        popover.style.top = rect.bottom + window.scrollY + 5 + "px";
        popover.style.left = rect.left + window.scrollX + "px";
        
        currentPopover = popover;
        
        // Global click to close
        document.addEventListener("click", closePopoverOnClickOutside);
    }
    
    function closePopover() {
        if (currentPopover) {
          currentPopover.classList.remove("active");
            currentPopover = null;
          document.removeEventListener("click", closePopoverOnClickOutside);
        }
    }
    
    function closePopoverOnClickOutside(e) {
        if (currentPopover && !currentPopover.contains(e.target)) {
            closePopover();
        }
    }

      function selectEnvOptionFromElement(el) {
        const key = el.getAttribute("data-key");
        const val = el
          .getAttribute("data-value")
          .replace(/&#39;/g, "'")
          .replace(/&quot;/g, '"');
        selectEnvOption(key, val);
      }
    
    function selectEnvOption(key, val) {
        state.environment[key] = val;
        
        // Special Logic for Transition - calculate transition_to
        if (key === "transition") {
          const transitionIndex = TERRAIN_DATA.transitions.indexOf(val);
          const lfOpts =
            TERRAIN_DATA.landforms[state.environment.climate] || [];
          
          if (transitionIndex >= 0 && lfOpts && lfOpts.length > 0) {
            // Transitions 1-3 (indices 0-2): same terrain
            // Transitions 4-6 (indices 3-5): different terrain
            if (transitionIndex < 3) {
              // Same terrain - use current landform
              state.environment.transition_to = state.environment.landform;
            } else {
              // Different terrain - roll a new landform (different from current)
              let newLandform;
              let attempts = 0;
              do {
                newLandform = lfOpts[Math.floor(Math.random() * lfOpts.length)];
                attempts++;
                // If we've tried many times and it's still the same, just use it anyway
                if (attempts > 10) break;
              } while (
                newLandform === state.environment.landform &&
                lfOpts.length > 1
              );
              state.environment.transition_to = newLandform;
            }
          }
        }
        
        // Special Logic for transition_to
        if (key === "transition_to") {
          const transitionIndex = TERRAIN_DATA.transitions.indexOf(
            state.environment.transition
          );
          if (transitionIndex >= 0 && transitionIndex < 3) {
            // Transitions 1-3 mean same landform, so Transition To must mirror Landform
            state.environment.transition_to = state.environment.landform;
          } else {
            // User manually selected a transition_to landform (Transitions 4-6)
            state.environment.transition_to = val;
          }
        }
        
        // Special Logic for landform change - update transition_to if transition is 1-3 (same terrain)
        if (key === "landform" && state.environment.transition) {
          const transitionIndex = TERRAIN_DATA.transitions.indexOf(state.environment.transition);
          if (transitionIndex >= 0 && transitionIndex < 3) {
            // Transitions 1-3 mean same terrain, so transition_to should match current landform
            state.environment.transition_to = val;
          }
        }

        // Special Logic for Climate change - regenerate all other fields randomly
        if (key === "climate") {
          // Randomize landform (depends on climate)
            const lfOpts = TERRAIN_DATA.landforms[val];
          if (lfOpts && lfOpts.length > 0) {
            state.environment.landform =
              lfOpts[Math.floor(Math.random() * lfOpts.length)];
          }

          // Randomize weather pattern (depends on climate)
            const wpOpts = TERRAIN_DATA.weatherPatterns[val];
          if (wpOpts && wpOpts.length > 0) {
            state.environment.weather_pattern =
              wpOpts[Math.floor(Math.random() * wpOpts.length)];
          }

          // Randomize all other independent fields
          if (TERRAIN_DATA.transitions.length > 0) {
            state.environment.transition =
              TERRAIN_DATA.transitions[
                Math.floor(Math.random() * TERRAIN_DATA.transitions.length)
              ];
            // Recalculate transition_to based on the new transition
            const transitionIndex = TERRAIN_DATA.transitions.indexOf(state.environment.transition);
            if (transitionIndex >= 0 && lfOpts && lfOpts.length > 0) {
              if (transitionIndex < 3) {
                state.environment.transition_to = state.environment.landform;
              } else {
                let newLandform;
                let attempts = 0;
                do {
                  newLandform = lfOpts[Math.floor(Math.random() * lfOpts.length)];
                  attempts++;
                  if (attempts > 10) break;
                } while (newLandform === state.environment.landform && lfOpts.length > 1);
                state.environment.transition_to = newLandform;
              }
            }
          }
          if (TERRAIN_DATA.terrainConditions.length > 0) {
            state.environment.terrain_condition =
              TERRAIN_DATA.terrainConditions[
                Math.floor(
                  Math.random() * TERRAIN_DATA.terrainConditions.length
                )
              ];
          }
          if (TERRAIN_DATA.pois.length > 0) {
            state.environment.poi =
              TERRAIN_DATA.pois[
                Math.floor(Math.random() * TERRAIN_DATA.pois.length)
              ];
          }
          if (TERRAIN_DATA.weatherConditions.length > 0) {
            state.environment.weather_condition =
              TERRAIN_DATA.weatherConditions[
                Math.floor(
                  Math.random() * TERRAIN_DATA.weatherConditions.length
                )
              ];
          }
        }
        
        saveState();
        renderEnvironment();
        closePopover();
    }
    
    function randomizeAndSelect(key) {
        // Find options based on key
        let opts = [];
        if (key === "climate") opts = TERRAIN_DATA.zones;
        else if (key === "landform")
          opts = TERRAIN_DATA.landforms[state.environment.climate] || [];
        else if (key === "transition") opts = TERRAIN_DATA.transitions;
        else if (key === "transition_to") {
          const transitionIndex = TERRAIN_DATA.transitions.indexOf(
            state.environment.transition
          );
          if (transitionIndex >= 0 && transitionIndex < 3) {
            // Locked to current landform for transitions 1-3
            selectEnvOption("transition_to", state.environment.landform);
            return;
          }
          opts = TERRAIN_DATA.landforms[state.environment.climate] || [];
        }
        else if (key === "terrain_condition")
          opts = TERRAIN_DATA.terrainConditions;
        else if (key === "poi") opts = TERRAIN_DATA.pois;
        else if (key === "weather_pattern")
          opts = TERRAIN_DATA.weatherPatterns[state.environment.climate] || [];
        else if (key === "weather_shift") opts = TERRAIN_DATA.weatherShifts;
        else if (key === "weather_condition")
          opts = TERRAIN_DATA.weatherConditions;
        else if (key === "weather_event") opts = TERRAIN_DATA.weatherEvents;

        if (opts && opts.length > 0) {
            const rand = Math.floor(Math.random() * opts.length);
            selectEnvOption(key, opts[rand]);
        }
    }

    function init() {
      try {
        loadState();
        } catch (e) {
        console.error("Failed to load state:", e);
      }
      render();
    }
    
    // Cleanup old helpers no longer needed for direct select manipulation
    // but generic randomizers might still be useful via buttons if we kept them?
    // User wants "text values should open a menu", implying the menu handles it.
    // I put randomize button IN the popover header.
    
    // --- Environment Helpers ---
    function updateEnvironment() {
        // Region is now handled via location menu, this function kept for compatibility
           saveState();
    }
    
    // Legacy functions removed: populateClimateSelect, updateLandformOptions, onClimateChange, randomize...
    // New logic handled via openEnvMenu / selectEnvOption / randomizeAndSelect logic.

    function loadState() {
        const stored = localStorage.getItem("wandyr-session-v3");
      if (stored) {
        const loaded = JSON.parse(stored);
        
        state = {
            ...DEFAULT_STATE,
            ...loaded,
            session: { ...DEFAULT_STATE.session, ...(loaded.session || {}) },
            adventure: { ...DEFAULT_STATE.adventure, ...(loaded.adventure || {}) },
            environment: { 
                ...DEFAULT_STATE.environment, 
                ...(loaded.environment || {}),
            },
            rumor: { 
                ...DEFAULT_STATE.rumor, 
                ...(loaded.rumor || {}),
              blessing: {
                ...DEFAULT_STATE.rumor.blessing,
                ...(loaded.rumor?.blessing || {}),
            },
            },
            dice: { ...DEFAULT_STATE.dice, ...(loaded.dice || {}) },
        };
        // Ensure new fields exist if migrating
          if (!state.environment.climate)
            state.environment.climate = "Temperate";
          if (
            !state.environment.weather_pattern &&
            state.environment.conditions
          ) {
            // If old 'conditions' exists, migrate it to 'weather_pattern'
            state.environment.weather_pattern = state.environment.conditions; 
        }
        // Remove old 'conditions' field if it exists after migration
        if (state.environment.conditions !== undefined) {
            delete state.environment.conditions;
        }

          if (loaded.muster) state.muster = loaded.muster;
          if (loaded.camp) state.camp = loaded.camp;
        
          if (loaded.others) {
            state.others = loaded.others;
          } else if (loaded.threats) {
            state.others = loaded.threats.map((t) => {
              let s = "fresh";
              if (t.condition === "hit") s = "hit";
              if (t.condition === "fled") s = "fled";
              if (t.condition === "dead") s = "dead";
              if (t.condition === "active") s = "fresh";
                return {
                    id: t.id,
                    name: t.name,
                    description: t.description,
                    level: t.level,
                    oracle: t.oracle,
                    status: s,
                reaction: t.reaction || "Neutral",
                };
            });
        }
        
          if (typeof loaded.rumor?.blessingActive === "boolean") {
             state.rumor.blessing.active = loaded.rumor.blessingActive;
        }

          // Initialize previousLocations if missing
          if (!state.previousLocations) {
            state.previousLocations = [];
          }
      } else {
          // New session or no data: Randomize Environment immediately
          initialRandomizeEnv();
          state.previousLocations = [];
      }
      
      // Safety check: if loaded state has empty env fields (e.g. from partial previous state), fill them
      ensureEnvData();
    }

    function initialRandomizeEnv() {
        // Pick random Climate first
        const zones = TERRAIN_DATA.zones;
        state.environment.climate =
          zones[Math.floor(Math.random() * zones.length)];
        // ensureEnvData will randomize all other fields that are empty
        ensureEnvData();
        saveState();
    }
    
    function ensureEnvData() {
        const env = state.environment;
        // Climate
        if (!env.climate) env.climate = "Temperate";
        
        // Landform (dependent on climate)
        if (!env.landform) {
          const opts =
            TERRAIN_DATA.landforms[env.climate] ||
            TERRAIN_DATA.landforms["Temperate"];
            env.landform = opts[Math.floor(Math.random() * opts.length)];
        }

        // Transition
        if (!env.transition) {
          const opts = TERRAIN_DATA.transitions;
          env.transition = opts[Math.floor(Math.random() * opts.length)];
        }

        // Calculate / reconcile transition_to based on transition
        if (env.transition) {
          const transitionIndex = TERRAIN_DATA.transitions.indexOf(env.transition);
          const lfOpts =
            TERRAIN_DATA.landforms[env.climate] ||
            TERRAIN_DATA.landforms["Temperate"];
          
          if (transitionIndex >= 0 && lfOpts && lfOpts.length > 0) {
            // Transitions 1-3: same landform (inherit current landform)
            if (transitionIndex < 3) {
              env.transition_to = env.landform;
            } else {
              // Transitions 4-6: different landform
              // If missing or accidentally equal to current landform, roll a different one (when possible)
              if (!env.transition_to || env.transition_to === env.landform) {
                let newLandform;
                let attempts = 0;
                do {
                  newLandform = lfOpts[Math.floor(Math.random() * lfOpts.length)];
                  attempts++;
                  if (attempts > 10) break;
                } while (newLandform === env.landform && lfOpts.length > 1);
                env.transition_to = newLandform;
              }
            }
          }
        }
        
        // Weather Pattern (dependent on climate)
        if (!env.weather_pattern) {
          const opts =
            TERRAIN_DATA.weatherPatterns[env.climate] ||
            TERRAIN_DATA.weatherPatterns["Temperate"];
             env.weather_pattern = opts[Math.floor(Math.random() * opts.length)];
        }
        
        // Others basic
        if (!env.terrain_condition) {
            const opts = TERRAIN_DATA.terrainConditions;
            env.terrain_condition = opts[Math.floor(Math.random() * opts.length)];
        }
        if (!env.poi) {
            const opts = TERRAIN_DATA.pois;
            env.poi = opts[Math.floor(Math.random() * opts.length)];
        }
        if (!env.weather_shift) {
            const opts = TERRAIN_DATA.weatherShifts;
            env.weather_shift = opts[Math.floor(Math.random() * opts.length)];
        }
        if (!env.weather_condition) {
            const opts = TERRAIN_DATA.weatherConditions;
            env.weather_condition = opts[Math.floor(Math.random() * opts.length)];
        }
        if (!env.weather_event) {
            const opts = TERRAIN_DATA.weatherEvents;
            env.weather_event = opts[Math.floor(Math.random() * opts.length)];
        }
    }

    function saveState() {
        localStorage.setItem("wandyr-session-v3", JSON.stringify(state));
    }
    
    // ... uuid ...
    function uuid() {
        return "xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx".replace(/[xy]/g, (c) => {
          const r = (Math.random() * 16) | 0;
          return (c === "x" ? r : (r & 0x3) | 0x8).toString(16);
      });
    }

        document.getElementById("actions-dropdown").classList.toggle("active");
      }
      document.addEventListener("click", (e) => {
        const menu = document.querySelector(".actions-menu");

      });

    function resetSession() {
        if (
          confirm(
            "Are you sure you want to reset everything? cannot be undone."
          )
        ) {
        state = JSON.parse(JSON.stringify(DEFAULT_STATE));
          saveState();
          render();
      }
    }
    function exportData() {
        const blob = new Blob([JSON.stringify(state, null, 2)], {
          type: "application/json",
        });
      const url = URL.createObjectURL(blob);
        const a = document.createElement("a");
        a.href = url;
        a.download = `wandyr-session-${new Date()
          .toISOString()
          .slice(0, 10)}.json`;
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
        URL.revokeObjectURL(url);
    }
    function importData(event) {
      const file = event.target.files[0];
        if (!file) return;
      const reader = new FileReader();
        reader.onload = (e) => {
        try {
          const loaded = JSON.parse(e.target.result);
            if (!loaded || typeof loaded !== "object")
              throw new Error("Invalid JSON structure");
            state = {
              ...DEFAULT_STATE,
              ...loaded,
              adventure: { ...DEFAULT_STATE.adventure, ...(loaded.adventure || {}) },
              environment: {
                ...DEFAULT_STATE.environment,
                ...loaded.environment,
              },
              rumor: { ...DEFAULT_STATE.rumor, ...loaded.rumor },
              dice: { ...DEFAULT_STATE.dice, ...loaded.dice },
            };
            if (loaded.muster) state.muster = loaded.muster;
            if (loaded.camp) state.camp = loaded.camp;
            if (loaded.others) state.others = loaded.others;
            else if (loaded.threats) {
              state.others = loaded.threats.map((t) => ({
                id: t.id,
                name: t.name,
                description: t.description,
                level: t.level,
                oracle: t.oracle,
                status:
                  (t.condition === "active" ? "fresh" : t.condition) || "fresh",
                reaction: t.reaction || "Neutral",
                }));
           }
            saveState();
            render();
            alert("Session imported successfully!");
          } catch (err) {
            console.error(err);
            alert("Invalid JSON file: " + err.message);
          }
      };
      reader.readAsText(file);
    }

    // --- Environment ---
    function updateEnvironment() {
        state.environment.region = document.getElementById("env-region").value;
      saveState();
    }

    // --- Dice ---
    
    function rollOracle(type) {
      const rolls = [];
        const count = type === "normal" ? 2 : 3;
      
        for (let i = 0; i < count; i++)
          rolls.push(Math.floor(Math.random() * 6) + 1);
      
      let total = 0;
      let kept = [];
      
      // clone to sort
        const sorted = [...rolls].sort((a, b) => a - b);
      
        if (type === "normal") {
        kept = sorted; // keep all 2
          total = kept.reduce((a, c) => a + c, 0);
        } else if (type === "adv") {
        // Drop lowest (first) UNLESS it is a 1.
          if (sorted[0] === 1) {
            kept = sorted; // Keep all 3
        } else {
            kept = sorted.slice(1);
        }
          total = kept.reduce((a, c) => a + c, 0);
        } else if (type === "dis") {
        // Drop highest (last)
        kept = sorted.slice(0, 2);
          total = kept.reduce((a, c) => a + c, 0);
      }
      
      state.dice = { rolls: rolls, type: type, total: total };
      saveState();
      renderDice();
    }
    
    function renderDice() {
        const d = state.dice || { rolls: [1, 1], type: "normal", total: 2 };
        const container = document.getElementById("oracle-result");
        let html = "";

        // We will just show the pips without outer box
        const rolls = d.rolls || [];
        
        rolls.forEach((val) => {
          html += `<span class="dice-face">${DICE_FACES[val - 1]}</span>`;
        });
        
        // Calculate Tags
        const sixes = rolls.filter((r) => r === 6).length;
        const ones = rolls.filter((r) => r === 1).length;
        let tagHtml = "";

        if (sixes > 0)
          tagHtml +=
            '<span style="color:#2e7d32; font-size:0.5em; margin-left:0.2rem;" title="Sweet">🌿</span>';
        if (ones > 0)
          tagHtml +=
            '<span style="color:#c62828; font-size:0.5em; margin-left:0.2rem;" title="Spicy">💀</span>';

        // Add Total & Tags
        html += `<span style="margin-left:0.2rem; font-size: 2rem; font-weight:bold; color:var(--accent-dark);">= ${d.total}${tagHtml}</span>`;
        
        if (container) container.innerHTML = html;
    }

      const targets = { easy: 6, normal: 8, hard: 10, extreme: 12 };
      const target = targets[difficulty] ?? 8;
      const r1 = rollD6();
      const r2 = rollD6();
      const rolls = [r1, r2];
      const total = r1 + r2;
      const result = total >= target ? "All clear" : "Adventure!";
      state.adventure = { target, total, result, rolls };
      saveState();
      renderAdventure();

    // --- Character Reorder (Drag & Drop) ---
    let draggedCharId = null;

    function initCharacterDnD() {
      const containers = [];
      const campMuster = document.getElementById("camp-muster-list");
      const campCamp = document.getElementById("camp-camp-list");
      const playMuster = document.getElementById("play-muster-list");

      if (campMuster) containers.push({ el: campMuster, list: "muster" });
      if (campCamp) containers.push({ el: campCamp, list: "camp" });
      if (playMuster) containers.push({ el: playMuster, list: "muster" });

      containers.forEach(({ el, list }) => {
        el.dataset.list = list;
        // prevent duplicate listeners by resetting handlers
        el.ondragover = (e) => handleCharDragOver(e, el);
        el.ondrop = (e) => handleCharDrop(e, el, containers);
      });

      document.querySelectorAll(".character-card[draggable='true']").forEach((card) => {
        card.ondragstart = (e) => {
          draggedCharId = card.dataset.charId;
          card.classList.add("dragging");
          try {
            e.dataTransfer.effectAllowed = "move";
            e.dataTransfer.setData("text/plain", draggedCharId);
          } catch {}
        };
        card.ondragend = () => {
          card.classList.remove("dragging");
          draggedCharId = null;
          // After a drag completes (drop or cancel), ensure state reflects DOM if it changed.
          // This is safe even if nothing moved.
          applyPartyOrderFromDom(containers);
        };
      });
    }

    function handleCharDragOver(e, container) {
      e.preventDefault();
      const dragging = document.querySelector(".character-card.dragging");
      if (!dragging) return;

      const after = getDragAfterElement(container, e.clientY);
      if (after == null) container.appendChild(dragging);
      else container.insertBefore(dragging, after);
    }

    function handleCharDrop(e, container, containers) {
      e.preventDefault();
      // DOM has already been updated during dragover; now persist into state
      applyPartyOrderFromDom(containers);
    }

    function getDragAfterElement(container, y, selector = ".character-card:not(.dragging)") {
      const els = [...container.querySelectorAll(selector)];
      return els.reduce(
        (closest, child) => {
          const box = child.getBoundingClientRect();
          const offset = y - box.top - box.height / 2;
          if (offset < 0 && offset > closest.offset) {
            return { offset, element: child };
          }
          return closest;
        },
        { offset: Number.NEGATIVE_INFINITY, element: null }
      ).element;
    }

    function applyPartyOrderFromDom(containers) {
      // Build quick lookup of all chars
      const byId = {};
      [...state.muster, ...state.camp].forEach((c) => (byId[c.id] = c));

      // In muster mode, camp lists may not be rendered/accurate; only trust visible containers
      const active = containers.filter(({ el }) => el && el.children);
      const idsForList = { muster: null, camp: null };

      active.forEach(({ el }) => {
        const list = el.dataset.list;
        const ids = [...el.querySelectorAll(".character-card")].map((c) => c.dataset.charId);
        if (ids.length) idsForList[list] = ids;
      });

      // Rebuild arrays based on DOM order where available; otherwise preserve current order by number
      const fallbackSorted = (arr) =>
        [...arr].sort((a, b) => (a.number || 99) - (b.number || 99));

      const newMuster = idsForList.muster
        ? idsForList.muster.map((id) => byId[id]).filter(Boolean)
        : fallbackSorted(state.muster);

      const newCamp = idsForList.camp
        ? idsForList.camp.map((id) => byId[id]).filter(Boolean)
        : fallbackSorted(state.camp);

      // Remove any duplicates (safety) and ensure every character is present exactly once
      const seen = new Set();
      const uniq = (arr) =>
        arr.filter((c) => {
          if (!c || seen.has(c.id)) return false;
          seen.add(c.id);
          return true;
        });

      const must = uniq(newMuster);
      const camp = uniq(newCamp);

      // Add any missing (if DOM containers were empty/not present)
      [...state.muster, ...state.camp].forEach((c) => {
        if (!seen.has(c.id)) {
          // Put missing into their existing list at the end
          (state.camp.some((x) => x.id === c.id) ? camp : must).push(c);
          seen.add(c.id);
        }
      });

      // Assign unique sequential party order numbers across all characters
      let n = 1;
      must.forEach((c) => (c.number = n++));
      camp.forEach((c) => (c.number = n++));

      state.muster = must;
      state.camp = camp;
      saveState();
      renderCharacterLists();
    }

    function normalizePartyOrder() {
      // Ensures party order numbers are always 1..n and unique
      const musterIds = new Set(state.muster.map((c) => c.id));
      const campIds = new Set(state.camp.map((c) => c.id));
      const all = [...state.muster, ...state.camp];

      // Stable sort by current number (then original position)
      const originalIndex = new Map(all.map((c, i) => [c.id, i]));
      all.sort((a, b) => {
        const an = a.number || 999;
        const bn = b.number || 999;
        return an - bn || (originalIndex.get(a.id) || 0) - (originalIndex.get(b.id) || 0);
      });

      let n = 1;
      all.forEach((c) => (c.number = n++));

      state.muster = all.filter((c) => musterIds.has(c.id));
      state.camp = all.filter((c) => campIds.has(c.id));
    }

    function partyOrderNeedsNormalize() {
      const all = [...state.muster, ...state.camp];
      const n = all.length;
      if (n <= 1) return false;

      const nums = all.map((c) => parseInt(c.number, 10)).filter((x) => Number.isFinite(x));
      if (nums.length !== n) return true;

      const set = new Set(nums);
      if (set.size !== n) return true;

      // Must be exactly 1..n
      for (let i = 1; i <= n; i++) {
        if (!set.has(i)) return true;
      }
      return false;
    }

    function setPartyOrder(charId, desiredNumber) {
      // Places the character at desiredNumber (1-indexed) in the overall party order,
      // then renumbers sequentially 1..n.
      const musterIds = new Set(state.muster.map((c) => c.id));
      const campIds = new Set(state.camp.map((c) => c.id));
      const all = [...state.muster, ...state.camp];

      const originalIndex = new Map(all.map((c, i) => [c.id, i]));
      const ordered = [...all].sort((a, b) => {
        const an = a.number || 999;
        const bn = b.number || 999;
        return an - bn || (originalIndex.get(a.id) || 0) - (originalIndex.get(b.id) || 0);
      });

      const idx = ordered.findIndex((c) => c.id === charId);
      if (idx === -1) {
        normalizePartyOrder();
        return;
      }

      const [char] = ordered.splice(idx, 1);
      const clampTo = Math.max(1, Math.min(ordered.length + 1, desiredNumber || ordered.length + 1));
      ordered.splice(clampTo - 1, 0, char);

      let n = 1;
      ordered.forEach((c) => (c.number = n++));

      state.muster = ordered.filter((c) => musterIds.has(c.id));
      state.camp = ordered.filter((c) => campIds.has(c.id));
    }

    // --- Character Actions ---
    function findChar(id) {
        let c = state.muster.find((x) => x.id === id);
        if (c) return { c, list: "muster" };
        c = state.camp.find((x) => x.id === id);
        if (c) return { c, list: "camp" };
        return null;
    }

    function modStat(id, stat, delta) {
        const f = findChar(id);
        if (f) {
          f.c[stat].current = Math.max(
            0,
            Math.min(f.c[stat].max, f.c[stat].current + delta)
          );
          saveState();
          renderCharacterLists();
        }
    }

    function modStatClick(id, stat, event) {
      if (event) event.stopPropagation();
      const delta = event && event.shiftKey ? 1 : -1;
      modStat(id, stat, delta);
    }

    function moveChar(id, dest) {
        const f = findChar(id);
        if (!f) return;
        state[f.list] = state[f.list].filter((x) => x.id !== id);
        state[dest].push(f.c);
        normalizePartyOrder();
        saveState();
        renderCharacterLists();
    }
    
    function deleteChar(id) {
        if (confirm("Delete character?")) {
          state.muster = state.muster.filter((x) => x.id !== id);
          state.camp = state.camp.filter((x) => x.id !== id);
          normalizePartyOrder();
          saveState();
          renderCharacterLists();
        }
    }
